<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Website Settings</title><link rel="stylesheet" href="css/admin.css"></head><body><main class="admin-wrap"><div class="panel rise"><a href="admin.html">← Dashboard</a><h1>⚙️ Website Settings</h1><p>Public website की basic information realtime update करें.</p><div class="settings-grid"><div class="field"><label>Shop Name</label><input id="shopname"></div><div class="field"><label>Location</label><input id="location"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>WhatsApp</label><input id="whatsapp"></div><div class="field"><label>Address</label><textarea id="address"></textarea></div><div class="field"><label>Opening Hours</label><input id="hours"></div></div><button id="save" class="btn btn-primary">Save Website Settings</button><div id="status"></div></div></main><script type="module">import{auth,db}from './js/firebase-config.js';import{onAuthStateChanged}from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{doc,setDoc,onSnapshot,serverTimestamp}from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';import{busy,toast}from './admin-common.js';const $=id=>document.getElementById(id);const ids=['shopname','location','phone','whatsapp','address','hours'];onAuthStateChanged(auth,u=>{if(u?.email?.toLowerCase()!=='zaynyt684@gmail.com')location.href='admin.html';else onSnapshot(doc(db,'settings','site'),s=>{if(s.exists())ids.forEach(id=>$(id).value=s.data()[id]||'')})});$('save').onclick=async()=>{const done=busy($('save'),'Saving...');try{const data=Object.fromEntries(ids.map(id=>[id,$(id).value.trim()]));data.updatedAt=serverTimestamp();await setDoc(doc(db,'settings','site'),data,{merge:true});toast('✓ Website settings saved')}catch(e){toast('✕ '+e.message,'error')}finally{done()}};</script></body></html>
