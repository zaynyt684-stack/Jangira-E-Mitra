<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Website Settings</title><link rel="stylesheet" href="css/admin.css"></head><body><main class="admin-wrap"><div class="panel rise"><a href="admin.html">← Dashboard</a><h1>⚙️ Website Settings</h1><p>Website information, branding aur WhatsApp promotion realtime update करें.</p><section><h2>🎨 Website Branding</h2><p>Logo aur favicon ke direct image URLs set करें.</p><div class="settings-grid"><div class="field"><label>Website / Shop Name</label><input id="shopname" placeholder="Jangira E-Mitra"></div><div class="field"><label>Logo URL</label><input id="logoUrl" placeholder="https://.../logo.png"></div><div class="field"><label>Favicon URL</label><input id="faviconUrl" placeholder="https://.../favicon.png"></div><div class="field"><label>Location</label><input id="location"></div></div><div style="margin:12px 0"><img id="logoPreview" alt="Logo preview" style="width:70px;height:70px;object-fit:contain;border-radius:14px;background:#18181b;border:1px solid #333"></div></section><section><h2>🟢 WhatsApp Promotion</h2><p>Floating WhatsApp promo ko yahin se control करें.</p><div class="settings-grid"><div class="field"><label>WhatsApp Number</label><input id="whatsapp" placeholder="918278674819"></div><div class="field"><label>Promotion Name</label><input id="waName" placeholder="Barkat"></div><div class="field"><label>Business / Panchayat Name</label><input id="waSubtitle" placeholder="Hindal Gol Panchayat E-Mitra"></div><div class="field"><label>Promotion Message</label><input id="waMessage" placeholder="Kisi bhi service ke liye WhatsApp par baat karein."></div></div></section><section><h2>📞 Contact</h2><div class="settings-grid"><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Address</label><textarea id="address"></textarea></div><div class="field"><label>Opening Hours</label><input id="hours"></div></div></section><button id="save" class="btn btn-primary">Save All Settings</button><div id="status"></div></div></main><script type="module">import{auth,db}from'./js/firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{doc,setDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';import{busy,toast}from'./admin-common.js';const $=id=>document.getElementById(id);const ids=['shopname','logoUrl','faviconUrl','location','phone','whatsapp','waName','waSubtitle','waMessage','address','hours'];onAuthStateChanged(auth,u=>{if(u?.email?.toLowerCase()!=='zaynyt684@gmail.com')location.href='admin.html';else onSnapshot(doc(db,'settings','site'),s=>{if(!s.exists())return;const d=s.data();ids.forEach(id=>$(id).value=d[id]||'');$('logoPreview').src=d.logoUrl||''})});$('logoUrl').addEventListener('input',e=>$('logoPreview').src=e.target.value);$('save').onclick=async()=>{const done=busy($('save'),'Saving...');try{const data=Object.fromEntries(ids.map(id=>[id,$(id).value.trim()]));data.updatedAt=serverTimestamp();await setDoc(doc(db,'settings','site'),data,{merge:true});toast('✓ Settings saved. Website realtime update ho jayegi.')}catch(e){toast('✕ '+e.message,'error')}finally{done()}};</script></body></html>
