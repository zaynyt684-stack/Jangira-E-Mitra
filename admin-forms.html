<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Forms</title><link rel="stylesheet" href="css/admin.css"><style>body{background:#f5f5f6}.wrap{max-width:1200px;margin:24px auto;padding:16px}.panel{background:#fff;padding:22px;border-radius:18px;border:1px solid #e5e5e7;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:20px}.field{margin:10px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:10px}.filebox{border:2px dashed #ccc;border-radius:14px;padding:18px;text-align:center}.btn{padding:10px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#ff8a00}.danger{background:#fee;color:#a00}.muted{color:#777;font-size:12px}.item{padding:14px;border:1px solid #eee;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:6px;flex-wrap:wrap}.search{margin-bottom:10px}.status{margin-top:10px;min-height:20px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="panel"><a href="admin.html">← Dashboard</a><h1>📄 Forms Manager</h1><p class="muted">Upload, edit, publish and delete PDF forms. Changes are realtime.</p><div class="grid"><div><input type="hidden" id="editId"><div class="field"><label>Form Name</label><input id="name"></div><div class="field"><label>Category</label><input id="category" placeholder="Certificates"></div><div class="field"><label>Keywords</label><input id="keywords" placeholder="आय, income"></div><div class="filebox"><input id="file" type="file" accept="application/pdf"><p id="fileName">New PDF चुनें (edit में optional)</p></div><div class="actions"><button id="upload" class="btn primary">Upload PDF</button><button id="save" class="btn primary">Save Form</button><button id="reset" class="btn">Reset</button></div><div id="status" class="status"></div></div><div><input id="search" class="field" placeholder="Search forms..."><div id="list"></div></div></div></div></div><script type="module">import{auth,db}from'./js/firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{collection,doc,setDoc,deleteDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';const ADMIN='zaynyt684@gmail.com',WORKER='https://jangira-upload.zaynyt684.workers.dev',$=x=>document.getElementById(x);let user=null,uploaded=null,items=[];const slug=x=>x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||Date.now()+'';const msg=x=>{$('status').textContent=x};function render(){const q=$('search').value.toLowerCase();$('list').innerHTML=items.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>`<div class=item><div><b>${x.name||''}</b><br><span class=muted>${x.category||'General'} · ${x.pdfName||'No PDF'}</span></div><div class=actions>${x.fileUrl?`<a class="btn" target="_blank" href="${x.fileUrl}">Open</a>`:''}<button class="btn" data-edit="${x.id}">Edit</button><button class="btn danger" data-del="${x.id}">Delete</button></div></div>`).join('')||'<p class=muted>No forms.</p>'}function reset(){['editId','name','category','keywords'].forEach(x=>$(x).value='');$('file').value='';$('fileName').textContent='New PDF चुनें (edit में optional)';uploaded=null}onAuthStateChanged(auth,u=>{if(!u||u.email?.toLowerCase()!==ADMIN)return location.href='admin.html';user=u;onSnapshot(collection(db,'forms'),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()})});$('search').oninput=render;$('file').onchange=()=>{$('fileName').textContent=$('file').files[0]?.name||'New PDF चुनें'};$('upload').onclick=async()=>{const f=$('file').files[0];if(!f)return msg('पहले PDF चुनें');if(f.type!=='application/pdf')return msg('सिर्फ PDF allowed है');if(f.size>10*1024*1024)return msg('PDF 10MB से छोटी रखें');try{$('upload').disabled=true;const bytes=new Uint8Array(await f.arrayBuffer());let bin='';for(let i=0;i<bytes.length;i+=32768)bin+=String.fromCharCode(...bytes.subarray(i,i+32768));const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+await user.getIdToken()},body:JSON.stringify({filename:f.name,content:btoa(bin),folder:'assets'})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Upload failed');uploaded={name:f.name,url:d.url||('assets/'+f.name)};msg('✓ Upload complete')}catch(e){msg('✕ '+e.message)}finally{$('upload').disabled=false}};$('save').onclick=async()=>{const n=$('name').value.trim();if(!n)return msg('Form name डालें');const id=$('editId').value||slug(n),old=items.find(x=>x.id===id)||{};const data={name:n,category:$('category').value.trim()||'General',keywords:$('keywords').value.split(',').map(x=>x.trim()).filter(Boolean),updatedAt:serverTimestamp()};if(uploaded){data.pdfName=uploaded.name;data.fileUrl=uploaded.url}else if(old.fileUrl){data.pdfName=old.pdfName;data.fileUrl=old.fileUrl}try{await setDoc(doc(db,'forms',id),data,{merge:true});msg('✓ Form saved and live');reset()}catch(e){msg('✕ '+e.message)}};$('reset').onclick=reset;document.addEventListener('click',async e=>{const id=e.target.dataset.edit;if(id){const x=items.find(a=>a.id===id);if(!x)return;$('editId').value=id;$('name').value=x.name||'';$('category').value=x.category||'';$('keywords').value=(x.keywords||[]).join(', ');$('fileName').textContent='Existing: '+(x.pdfName||'No PDF');uploaded=null;window.scrollTo({top:0,behavior:'smooth'})}if(e.target.dataset.del&&confirm('Delete this form?')){try{await deleteDoc(doc(db,'forms',e.target.dataset.del));msg('✓ Deleted')}catch(x){msg('✕ '+x.message)}}});</script></body></html>
