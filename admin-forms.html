<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Forms</title><link rel="stylesheet" href="css/admin.css"><style>body{background:#f5f5f6}.wrap{max-width:1100px;margin:30px auto;padding:16px}.panel{background:#fff;padding:24px;border-radius:20px;border:1px solid #e5e5e7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin:12px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px}.filebox{border:2px dashed #ccc;border-radius:14px;padding:20px;text-align:center;margin:12px 0}.btn{padding:11px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#ff8a00}.danger{background:#fee;color:#a00}.item{padding:14px;border:1px solid #eee;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px}.spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;margin-right:7px}@keyframes s{to{transform:rotate(360deg)}}.status{margin-top:10px;font-size:13px;color:#555;word-break:break-word}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="panel"><a href="admin.html">← Dashboard</a><h1>📄 Forms Manager</h1><p>अब PDF सीधे Admin Panel से upload करें. GitHub assets में automatic publish होगा.</p><div class="grid"><div><div class="field"><label>Form Name</label><input id="name" placeholder="आय प्रमाण पत्र फॉर्म"></div><div class="field"><label>Category</label><input id="category" placeholder="Certificates"></div><div class="field"><label>Keywords</label><input id="keywords" placeholder="आय, income"></div><div class="filebox"><input id="file" type="file" accept="application/pdf"><p id="fileName">PDF चुनें</p></div><button id="upload" class="btn primary">Upload PDF</button><div id="status" class="status"></div><button id="save" class="btn primary" style="margin-top:10px" disabled>Save Form</button></div><div><h3>Saved Forms</h3><div id="list"></div></div></div></div></div><script type="module">import{auth,db}from'./js/firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{collection,doc,setDoc,deleteDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';const WORKER='https://jangira-upload.zaynyt684.workers.dev';const ADMIN='zaynyt684@gmail.com';const $=x=>document.getElementById(x),slug=x=>x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||Date.now()+'';let user=null,uploaded=null;const toast=m=>{$('status').textContent=m};onAuthStateChanged(auth,u=>{if(u?.email?.toLowerCase()!==ADMIN)location.href='admin.html';else{user=u;onSnapshot(collection(db,'forms'),s=>{$('list').innerHTML=s.docs.map(d=>{const x=d.data();return`<div class=item><span><b>${x.name||''}</b><br><small>${x.pdfName||''}</small></span><span>${x.fileUrl?`<a href="${x.fileUrl}" target="_blank">Open</a>`:''} <button class="btn danger" data-id="${d.id}">Delete</button></span></div>`}).join('')||'<p>No forms.</p>'})}});$('file').onchange=()=>{$('fileName').textContent=$('file').files[0]?.name||'PDF चुनें'};$('upload').onclick=async()=>{const f=$('file').files[0];if(!f)return toast('पहले PDF चुनें');if(f.type!=='application/pdf')return toast('सिर्फ PDF allowed है');if(f.size>10*1024*1024)return toast('PDF 10MB से छोटी रखें');if(!user)return toast('Admin login required');const b=$('upload');b.disabled=true;b.innerHTML='<span class=spinner></span>Uploading...';try{const bytes=new Uint8Array(await f.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));const token=await user.getIdToken();const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({filename:f.name,content:btoa(binary),folder:'assets'})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw new Error(data.error||'Upload failed');uploaded={name:f.name,url:data.url||('assets/'+f.name)};toast('✓ Upload complete: '+uploaded.url);$('save').disabled=false;$('save').textContent='Save Form'}catch(e){toast('✕ '+e.message)}finally{b.disabled=false;if(!uploaded)b.textContent='Upload PDF'}};$('save').onclick=async()=>{if(!uploaded)return;const b=$('save');b.disabled=true;b.innerHTML='<span class=spinner></span>Saving...';try{const id=slug($('name').value||uploaded.name.replace(/\.pdf$/i,''));await setDoc(doc(db,'forms',id),{name:$('name').value.trim()||uploaded.name.replace(/\.pdf$/i,''),category:$('category').value.trim()||'General',keywords:$('keywords').value.split(',').map(x=>x.trim()).filter(Boolean),pdfName:uploaded.name,fileUrl:uploaded.url,updatedAt:new Date()},{merge:true});toast('✓ Form saved and live');$('name').value='';$('category').value='';$('keywords').value='';$('file').value='';uploaded=null;b.disabled=true;b.textContent='Save Form'}catch(e){toast('✕ '+e.message)}finally{if(uploaded)b.disabled=false}};document.addEventListener('click',async e=>{if(e.target.dataset.id&&confirm('Delete form?')){try{await deleteDoc(doc(db,'forms',e.target.dataset.id));toast('✓ Deleted')}catch(x){toast('✕ '+x.message)}}});</script></body></html>
