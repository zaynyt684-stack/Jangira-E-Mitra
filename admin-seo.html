<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • SEO</title><link rel="stylesheet" href="css/admin.css"></head><body><main class="admin-wrap"><section class="panel rise"><a href="admin.html">← Dashboard</a><h1>🔎 SEO Control</h1><p class="muted">Search engine title, description aur social preview metadata manage karein.</p><div class="field"><label>Site Title</label><input id="title" placeholder="Jangira E Mitra | Rajasthan E-Mitra"></div><div class="field"><label>Meta Description</label><textarea id="description" rows="4"></textarea></div><div class="field"><label>Keywords</label><input id="keywords" placeholder="e-mitra, Phalodi, Rajasthan, cyber cafe"></div><div class="field"><label>Open Graph Image URL</label><input id="ogImage" placeholder="assets/logo.png"></div><div class="field"><label>Robots</label><select id="robots"><option value="index,follow">index,follow</option><option value="noindex,nofollow">noindex,nofollow</option></select></div><button id="save" class="btn btn-primary">Save SEO Settings</button><div id="status" class="muted" style="margin-top:12px"></div></section></main><script type="module">import{db}from'./js/firebase-config.js';import{requireAdmin,$,toast,busy}from'./admin-common.js';import{doc,setDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';const ids=['title','description','keywords','ogImage','robots'];requireAdmin(()=>onSnapshot(doc(db,'seo','site'),s=>{if(!s.exists())return;const d=s.data();ids.forEach(id=>$(id).value=d[id]||'')}));$('save').onclick=async()=>{const done=busy($('save'));try{const data=Object.fromEntries(ids.map(id=>[id,$(id).value.trim()]));data.updatedAt=serverTimestamp();await setDoc(doc(db,'seo','site'),data,{merge:true});$('status').textContent='✓ SEO settings saved';toast('✓ SEO updated')}catch(e){$('status').textContent='✕ '+e.message;toast('✕ '+e.message,'error')}finally{done()}};</script></body></html>
