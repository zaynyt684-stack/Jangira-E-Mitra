<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Upload Assets</title><link rel="stylesheet" href="css/admin.css"><style>.upload{max-width:700px;margin:40px auto}.drop{border:2px dashed #bbb;border-radius:16px;padding:35px;text-align:center}.progress{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin:16px 0}.progress i{display:block;height:100%;width:0;background:#ff8a00;transition:.2s}.muted{color:#777}.result{margin-top:15px;padding:12px;border-radius:10px;background:#f5f5f5;word-break:break-all}</style></head><body><main class="admin-wrap"><section class="panel upload"><a href="admin.html">← Dashboard</a><h1>Upload Assets</h1><p class="muted">PDF forms और posters को GitHub assets folder में publish करें. Firebase Storage की जरूरत नहीं.</p><div class="drop"><input id="file" type="file" accept="application/pdf,image/*"><p id="name">File चुनें</p></div><div class="field"><label>Folder</label><input id="folder" value="assets"></div><button id="upload" class="btn btn-primary">Upload to GitHub</button><div class="progress"><i id="bar"></i></div><div id="status" class="result"></div></section></main><script type="module">import{auth}from './js/firebase-config.js';import{onAuthStateChanged}from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';const $=id=>document.getElementById(id);let user=null;onAuthStateChanged(auth,u=>{if(u?.email?.toLowerCase()==='zaynyt684@gmail.com')user=u;else location.href='admin.html'});$('file').onchange=()=>{$('name').textContent=$('file').files[0]?.name||'File चुनें'};$('upload').onclick=async()=>{const f=$('file').files[0];if(!f)return $('status').textContent='पहले file चुनें';if(!user)return $('status').textContent='Admin login required';if(f.size>10*1024*1024)return $('status').textContent='10 MB से बड़ी file अभी upload नहीं कर सकते';const b=await f.arrayBuffer(),bytes=new Uint8Array(b);let binary='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));const base64=btoa(binary);const filename=f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const folder=$('folder').value.trim().replace(/^\/|\/$/g,'')||'assets';$('upload').disabled=true;$('upload').textContent='Starting...';$('status').textContent='GitHub workflow start करने की जरूरत है. GitHub Actions API browser से secure token के बिना trigger नहीं किया जा सकता.';$('bar').style.width='25%';setTimeout(()=>{$('upload').disabled=false;$('upload').textContent='Upload to GitHub';$('bar').style.width='0%'},1500)};</script></body></html>
