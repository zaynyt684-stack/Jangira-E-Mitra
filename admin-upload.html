<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Upload Assets</title><link rel="stylesheet" href="css/admin.css"><style>.upload{max-width:760px;margin:40px auto}.drop{border:2px dashed #bbb;border-radius:16px;padding:35px;text-align:center}.progress{height:8px;background:#eee;border-radius:10px;overflow:hidden;margin:16px 0}.progress i{display:block;height:100%;width:0;background:#ff8a00;transition:.2s}.muted{color:#777}.result{margin-top:15px;padding:12px;border-radius:10px;background:#f5f5f5;word-break:break-word}.row{display:grid;gap:12px;margin:18px 0}.btn:disabled{opacity:.6;cursor:not-allowed}</style></head><body><main class="admin-wrap"><section class="panel upload"><a href="admin.html">← Dashboard</a><h1>Upload Assets</h1><p class="muted">PDF forms, posters और images सीधे GitHub assets में publish करें.</p><div class="drop"><input id="file" type="file" accept="application/pdf,image/*"><p id="name">File चुनें</p></div><div class="row"><label>Folder<input id="folder" value="assets"></label></div><button id="upload" class="btn btn-primary">Upload to GitHub</button><div class="progress"><i id="bar"></i></div><div id="status" class="result">Ready</div></section></main><script type="module">import{auth}from './js/firebase-config.js';import{onAuthStateChanged}from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';const WORKER='https://jangira-upload.zaynyt684.workers.dev';const ADMIN_EMAIL='zaynyt684@gmail.com';const $=id=>document.getElementById(id);let user=null;onAuthStateChanged(auth,u=>{if(u?.email?.toLowerCase()===ADMIN_EMAIL)user=u;else location.href='admin.html'});$('file').onchange=()=>{$('name').textContent=$('file').files[0]?.name||'File चुनें'};function setStatus(t){$('status').textContent=t} $('upload').onclick=async()=>{const f=$('file').files[0];if(!f)return setStatus('पहले file चुनें');if(!user)return setStatus('Admin login required');if(f.size>10*1024*1024)return setStatus('10 MB से बड़ी file अभी upload नहीं कर सकते');try{$('upload').disabled=true;$('upload').textContent='Preparing...';$('bar').style.width='10%';const bytes=new Uint8Array(await f.arrayBuffer());let binary='';const chunk=0x8000;for(let i=0;i<bytes.length;i+=chunk)binary+=String.fromCharCode(...bytes.subarray(i,i+chunk));const base64=btoa(binary);$('bar').style.width='45%';setStatus('Uploading to GitHub...');$('upload').textContent='Uploading...';const token=await user.getIdToken();const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({filename:f.name,content:base64,folder:$('folder').value.trim()||'assets'})});const data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw new Error(data.error||'Upload failed');$('bar').style.width='100%';setStatus('✓ Uploaded: '+data.path);$('upload').textContent='Upload Complete';}catch(e){$('bar').style.width='0%';setStatus('✕ '+e.message);$('upload').textContent='Upload to GitHub';}finally{setTimeout(()=>{$('upload').disabled=false;if($('upload').textContent==='Upload Complete')$('upload').textContent='Upload Again'},800)}};</script></body></html>
