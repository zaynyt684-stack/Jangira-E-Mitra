<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fraud Alert | Jangira E Mitra</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/home-awareness.css"></head><body><main class="home-awareness"><div class="container"><article class="awareness-card alert" style="max-width:850px;margin:auto"><span class="awareness-badge">⚠ FRAUD ALERT</span><h1 id="title">Important Safety Warning</h1><div id="content"></div><a class="awareness-link" href="fraud-alerts.html">← सभी Fraud Alerts</a></article></div></main><script>const d={"otp-upi":{t:"OTP, UPI PIN और Password share न करें",p:["कोई genuine support person आपसे आपका UPI PIN या OTP बताने को नहीं कहता।","Unknown collect request, QR code या payment link को verify किए बिना approve न करें.","Suspicious call/message आए तो बातचीत रोकें और official contact source से verify करें."]},"fake-site":{t:"Fake Government Website से सावधान",p:["Search result की हर website official नहीं होती।","Website address और official government source को verify करें।","Suspicious page पर Aadhaar, PAN, password या payment details upload न करें."]},"whatsapp-apk":{t:"WhatsApp पर suspicious APK से बचें",p:["Unknown person द्वारा भेजी APK या app file install न करें।","Screen sharing या remote access की अनुमति अनजान व्यक्ति को न दें।","Suspicious message को report/block करें और official source से जानकारी verify करें."]}};const a=d[new URLSearchParams(location.search).get("id")]||d["otp-upi"];document.getElementById("title").textContent=a.t;document.getElementById("content").innerHTML=a.p.map(x=>`<p style="line-height:1.8;color:#555">${x}</p>`).join("");</script></body></html>
