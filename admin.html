<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111114"><title>Jangira E Mitra Admin</title><link rel="stylesheet" href="css/style.css"><style>body{background:#f5f5f6}.wrap{max-width:1100px;margin:40px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e5e7;border-radius:20px;padding:24px;box-shadow:0 12px 40px #0000000b}.login{max-width:430px;margin:70px auto}.field{margin:14px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:#111114;color:#fff}.orange{background:#ff8a00;color:#111}.light{background:#eee}.hidden{display:none!important}.error{color:#c62828;margin-top:10px;font-size:13px}.status{margin-top:12px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.tile{display:block;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e5e7;border-radius:16px;padding:20px;transition:.2s}.tile:hover{transform:translateY(-2px);box-shadow:0 10px 30px #00000010}.tile b{display:block;font-size:22px;margin-bottom:8px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head-actions{display:flex;gap:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><section id="loginView" class="card login"><div style="font-size:11px;font-weight:900;letter-spacing:1.5px;color:#ff8a00">JANGIRA E MITRA</div><h1>Admin Login</h1><p>Website control panel में login करें.</p><div class="field"><label>Email</label><input id="adminEmail" type="email" autocomplete="username" placeholder="Admin email"></div><div class="field"><label>Password</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Password"></div><button id="loginBtn" class="btn primary" style="width:100%">Login</button><div id="loginError" class="error"></div><div id="loginStatus" class="status"></div></section><section id="dashboardView" class="hidden"><div class="card"><div class="head"><div><div style="font-size:11px;font-weight:900;letter-spacing:1.5px;color:#ff8a00">CONTROL CENTER</div><h1 style="margin:5px 0">Jangira E Mitra CMS</h1><div id="adminUser"></div></div><div class="head-actions"><a class="btn light" href="index.html">Website</a><button id="logoutBtn" class="btn orange">Logout</button></div></div><div class="grid"><a class="tile" href="admin-broadcast.html"><b>📢</b>Broadcast<small>Live announcement</small></a><a class="tile" href="admin-banners.html"><b>🖼️</b>Banners & Posters<small>Homepage visuals</small></a><a class="tile" href="admin-forms.html"><b>📄</b>Forms<small>PDF forms</small></a><a class="tile" href="admin-services.html"><b>🛠️</b>Services<small>Services & documents</small></a><a class="tile" href="admin-links.html"><b>🔗</b>Online Services<small>Official links</small></a><a class="tile" href="admin-settings.html"><b>⚙️</b>Website Settings<small>Contact & site information</small></a></div></div></section></main><script type="module">import{auth}from './js/firebase-config.js';import{signInWithEmailAndPassword,onAuthStateChanged,signOut}from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';const ADMIN_EMAIL='zaynyt684@gmail.com';const $=id=>document.getElementById(id);function setBusy(on){const b=$('loginBtn');b.disabled=on;b.textContent=on?'Signing in...':'Login'}function showError(m){$('loginError').textContent=m;$('loginStatus').textContent=''}$('loginBtn').addEventListener('click',async()=>{const email=$('adminEmail').value.trim(),password=$('adminPassword').value;if(!email||!password)return showError('Email और password दोनों डालें।');if(email.toLowerCase()!==ADMIN_EMAIL)return showError('यह authorized admin email नहीं है।');setBusy(true);showError('');try{await signInWithEmailAndPassword(auth,email,password);$('loginStatus').textContent='✓ Login successful';}catch(e){console.error(e);const messages={'auth/invalid-credential':'Email या password गलत है।','auth/user-not-found':'यह Firebase user मौजूद नहीं है।','auth/wrong-password':'Password गलत है।','auth/invalid-email':'Email format गलत है।','auth/too-many-requests':'बहुत ज्यादा attempts हुए हैं, थोड़ी देर बाद try करें।'};showError(messages[e.code]||('Login failed: '+e.code));}finally{setBusy(false)}});$('adminPassword').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('logoutBtn').addEventListener('click',()=>signOut(auth));onAuthStateChanged(auth,user=>{if(user&&user.email?.toLowerCase()===ADMIN_EMAIL){$('loginView').classList.add('hidden');$('dashboardView').classList.remove('hidden');$('adminUser').textContent=user.email}else{$('loginView').classList.remove('hidden');$('dashboardView').classList.add('hidden')}});</script></body></html>
