<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111114"><title>Jangira E Mitra Admin Login</title><link rel="stylesheet" href="css/style.css"><style>body{background:#f5f5f6}.wrap{max-width:1100px;margin:40px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e5e7;border-radius:20px;padding:24px;box-shadow:0 12px 40px #0000000b}.login{max-width:430px;margin:70px auto}.field{margin:14px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px}.field input:focus{outline:2px solid #ff8a0033;border-color:#ff8a00}.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.65;cursor:not-allowed}.primary{background:#111114;color:#fff}.orange{background:#ff8a00;color:#111}.light{background:#eee}.hidden{display:none!important}.error{color:#c62828;margin-top:10px;font-size:13px;min-height:18px}.status{margin-top:12px;font-size:13px;min-height:18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.tile{display:block;text-decoration:none;color:#111;background:#fff;border:1px solid #e5e5e7;border-radius:16px;padding:20px;transition:.2s}.tile:hover{transform:translateY(-2px);box-shadow:0 10px 30px #00000010}.tile b{display:block;font-size:22px;margin-bottom:8px}.tile small{display:block;color:#777;margin-top:5px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head-actions{display:flex;gap:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><section id="loginView" class="card login"><div style="font-size:11px;font-weight:900;letter-spacing:1.5px;color:#ff8a00">JANGIRA E MITRA</div><h1>Admin Login</h1><p>Website control panel में login करें.</p><div class="field"><label>Email</label><input id="adminEmail" type="email" autocomplete="username" placeholder="zaynyt684@gmail.com"></div><div class="field"><label>Password</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Firebase password"></div><button id="loginBtn" type="button" class="btn primary" style="width:100%">Login</button><div id="loginError" class="error"></div><div id="loginStatus" class="status"></div></section><section id="dashboardView" class="hidden"><div class="card"><div class="head"><div><div style="font-size:11px;font-weight:900;letter-spacing:1.5px;color:#ff8a00">CONTROL CENTER</div><h1 style="margin:5px 0">Jangira E Mitra CMS</h1><div id="adminUser"></div></div><div class="head-actions"><a class="btn light" href="index.html">Website</a><button id="logoutBtn" type="button" class="btn orange">Logout</button></div></div><div class="grid"><a class="tile" href="admin-broadcast.html"><b>📢</b>Broadcast<small>Live announcement</small></a><a class="tile" href="admin-banners.html"><b>🖼️</b>Banners & Posters<small>Homepage visuals</small></a><a class="tile" href="admin-forms.html"><b>📄</b>Forms<small>PDF forms</small></a><a class="tile" href="admin-services.html"><b>🛠️</b>Services<small>Services & documents</small></a><a class="tile" href="admin-links.html"><b>🔗</b>Online Services<small>Official links</small></a><a class="tile" href="admin-settings.html"><b>⚙️</b>Website Settings<small>Contact & site information</small></a></div></div></section></main><script type="module">const statusEl=document.getElementById('loginStatus'),errorEl=document.getElementById('loginError'),btn=document.getElementById('loginBtn');const ADMIN_EMAIL='zaynyt684@gmail.com';function error(m){errorEl.textContent=m;statusEl.textContent=''}function busy(v){btn.disabled=v;btn.textContent=v?'Signing in...':'Login'}statusEl.textContent='Firebase login ready';let auth=null,signIn=null,onState=null,signOutFn=null;try{const app=await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js');const fa=await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js');const firebaseConfig={apiKey:'AIzaSyBFkTebmxTpNnInrvYX-ffuUzQgUbRQlGw',authDomain:'jangira-e-mitra.firebaseapp.com',projectId:'jangira-e-mitra',storageBucket:'jangira-e-mitra.firebasestorage.app',messagingSenderId:'593826154587',appId:'1:593826154587:web:7e4d667e1ae19cf5cf977e'};const appInstance=app.initializeApp(firebaseConfig);auth=fa.getAuth(appInstance);signIn=fa.signInWithEmailAndPassword;onState=fa.onAuthStateChanged;signOutFn=fa.signOut;onState(auth,u=>{if(u?.email?.toLowerCase()===ADMIN_EMAIL){document.getElementById('loginView').classList.add('hidden');document.getElementById('dashboardView').classList.remove('hidden');document.getElementById('adminUser').textContent=u.email}else{document.getElementById('loginView').classList.remove('hidden');document.getElementById('dashboardView').classList.add('hidden')}});statusEl.textContent='✓ Firebase Auth connected'}catch(e){console.error(e);error('Firebase Auth load नहीं हुआ: '+e.message)}btn.addEventListener('click',async()=>{const email=document.getElementById('adminEmail').value.trim(),password=document.getElementById('adminPassword').value;if(!email||!password)return error('Email और password दोनों डालें।');if(email.toLowerCase()!==ADMIN_EMAIL)return error('यह authorized admin email नहीं है।');if(!auth||!signIn)return error('Firebase Auth अभी connected नहीं है। Page refresh करें।');busy(true);error('');statusEl.textContent='Connecting to Firebase...';try{await signIn(auth,email,password);statusEl.textContent='✓ Login successful'}catch(e){console.error(e);const m={'auth/invalid-credential':'Email या password गलत है।','auth/user-not-found':'Firebase Authentication में यह user नहीं मिला।','auth/wrong-password':'Password गलत है।','auth/invalid-email':'Email format गलत है।','auth/too-many-requests':'बहुत attempts हुए हैं। थोड़ी देर बाद try करें।','auth/operation-not-allowed':'Firebase Console में Email/Password Authentication enable नहीं है।'};error(m[e.code]||('Firebase error: '+e.code));}finally{busy(false)}});document.getElementById('adminPassword').addEventListener('keydown',e=>{if(e.key==='Enter')btn.click()});document.getElementById('logoutBtn').addEventListener('click',()=>signOutFn?.(auth));</script></body></html>
