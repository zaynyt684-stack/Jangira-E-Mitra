<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Downloads</title><link rel="stylesheet" href="css/admin.css"></head><body><main class="admin-wrap"><section class="panel rise"><a href="admin.html">← Dashboard</a><h1>⬇ Downloads</h1><p class="muted">Public downloadable resources manage karein.</p><div class="grid"><div><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Category</label><input id="category" placeholder="PDF / Resource"></div><div class="field"><label>File URL / Asset Path</label><input id="url" placeholder="assets/file.pdf"></div><div class="field"><label>Description</label><textarea id="description" rows="4"></textarea></div><label><input id="active" type="checkbox" checked> Active</label><div class="admin-actions" style="margin-top:14px"><button id="save" class="btn btn-primary">Save Download</button><button id="reset" class="btn btn-light">Reset</button></div></div><div id="list"></div></div></section></main><script type="module">import{db}from'./js/firebase-config.js';import{requireAdmin,$,toast,busy}from'./admin-common.js';import{collection,doc,setDoc,deleteDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';let items=[],editId='';const slug=x=>x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||Date.now()+'';function reset(){editId='';['title','category','url','description'].forEach(id=>$(id).value='');$('active').checked=true}function render(){$('list').innerHTML=items.map(x=>`<div class="item"><div><h3>${x.title||'Untitled'}</h3><p>${x.category||'Resource'} · ${x.url||''}</p><span class="status">${x.active===false?'Inactive':'Active'}</span></div><div class="admin-actions"><a class="btn btn-light" target="_blank" rel="noopener" href="${x.url||'#'}">Open</a><button class="btn btn-light" data-edit="${x.id}">Edit</button><button class="btn btn-danger" data-del="${x.id}">Delete</button></div></div>`).join('')||'<div class="empty">No downloads yet.</div>'}requireAdmin(()=>onSnapshot(collection(db,'downloads'),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()}));$('reset').onclick=reset;$('save').onclick=async()=>{if(!$('title').value.trim()||!$('url').value.trim())return toast('Title aur URL required','error');const done=busy($('save'));try{const id=editId||slug($('title').value);await setDoc(doc(db,'downloads',id),{title:$('title').value.trim(),category:$('category').value.trim(),url:$('url').value.trim(),description:$('description').value.trim(),active:$('active').checked,updatedAt:serverTimestamp()},{merge:true});toast('✓ Download saved');reset()}catch(e){toast('✕ '+e.message,'error')}finally{done()}};document.addEventListener('click',async e=>{const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');if(ed){const x=items.find(a=>a.id===ed.dataset.edit);editId=x.id;$('title').value=x.title||'';$('category').value=x.category||'';$('url').value=x.url||'';$('description').value=x.description||'';$('active').checked=x.active!==false;scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('Delete this download?')){try{await deleteDoc(doc(db,'downloads',del.dataset.del));toast('✓ Deleted')}catch(x){toast('✕ '+x.message,'error')}}});</script></body></html>
