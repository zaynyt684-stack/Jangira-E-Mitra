<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>Sign In | Jangira E Mitra</title><style>body{margin:0;min-height:100vh;color:#fff;background:radial-gradient(circle at 15% 10%,rgba(255,138,0,.17),transparent 30%),#09090b;font:14px system-ui,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(440px,100%);padding:30px;border:1px solid #ffffff1c;border-radius:28px;background:#ffffff0b;backdrop-filter:blur(28px);box-shadow:0 30px 90px #0008}.logo{width:64px;height:64px;object-fit:contain;margin-bottom:15px}.ey{color:#ffad4d;font-weight:900;letter-spacing:1.5px;font-size:11px}.card h1{font-size:34px;margin:8px 0}.muted{color:#aaa}.field{margin:14px 0}.field label{display:block;margin-bottom:6px;font-weight:800}.input{width:100%;box-sizing:border-box;padding:14px;border-radius:13px;border:1px solid #ffffff18;background:#0005;color:#fff;outline:0}.input:focus{border-color:#ff8a00;box-shadow:0 0 0 3px #ff8a0018}.btn{width:100%;padding:14px;border-radius:13px;border:1px solid #ffffff18;background:#ffffff08;color:#fff;font-weight:900;cursor:pointer;margin-top:8px}.primary{background:#ff8a00;color:#111;border-color:#ff8a00}.link{color:#ffad4d;font-weight:700;cursor:pointer}.error{margin-top:12px;padding:11px;border-radius:11px;color:#ffb0b0;background:#ff333311;border:1px solid #ff555533}.hidden{display:none!important}.row{display:flex;justify-content:space-between}.verify{margin-top:12px;padding:12px;border-radius:12px;background:#ff8a0010;border:1px solid #ff8a0030;color:#ffd3a0}.otp{display:flex;gap:8px}.otp input{flex:1}</style></head><body><div class="wrap"><main class="card"><img class="logo" src="assets/logo.png" alt="Jangira E Mitra"><div class="ey">JANGIRA E MITRA • MEMBER ACCOUNT</div><h1 id="heading">Welcome back</h1><p class="muted" id="sub">Sign in to access your account.</p><form id="form"><div class="field"><label>Email</label><input class="input" id="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input class="input" id="password" type="password" autocomplete="current-password" minlength="6" required></div><div class="row"><span></span><span id="forgot" class="link">Forgot password?</span></div><button class="btn primary" id="submit">Sign In →</button></form><button class="btn" id="google">Continue with Google</button><button class="btn" id="phone">Continue with Phone / SMS OTP</button><div id="phoneBox" class="hidden"><div class="field"><label>Phone number</label><input class="input" id="phoneNumber" type="tel" placeholder="+919876543210"></div><button class="btn primary" id="sendOtp" type="button">Send OTP</button><div id="otpBox" class="otp hidden"><input class="input" id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"><button class="btn primary" id="verifyOtp" type="button">Verify</button></div></div><p class="muted" style="text-align:center">New here? <span id="toggle" class="link">Create account</span></p><div id="verifyBox" class="verify hidden"></div><div id="error" class="error hidden"></div><div id="status" class="muted" style="text-align:center"></div><div id="recaptcha"></div></main></div><script type="module">import{auth}from'./js/firebase-config.js';import{signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,sendEmailVerification,GoogleAuthProvider,signInWithPopup,RecaptchaVerifier,signInWithPhoneNumber,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';const $=x=>document.getElementById(x);let signup=false,confirmation=null,verifier=null;function err(e){const m={'auth/invalid-credential':'Email ya password galat hai.','auth/email-already-in-use':'Is email se account already bana hua hai.','auth/weak-password':'Password kam se kam 6 characters ka rakho.','auth/invalid-email':'Email check karo.','auth/popup-closed-by-user':'Google sign-in cancel ho gaya.','auth/popup-blocked':'Popup blocked hai.','auth/too-many-requests':'Too many attempts. Thodi der baad try karo.','auth/network-request-failed':'Network connection check karo.','auth/invalid-phone-number':'Phone number +91 ke saath enter karo.','auth/code-expired':'OTP expire ho gaya. Naya OTP bhejo.','auth/invalid-verification-code':'OTP galat hai.','auth/captcha-check-failed':'reCAPTCHA verification failed. Dobara try karo.','auth/quota-exceeded':'SMS quota exceed ho gaya. Firebase Console me SMS quota/provider check karo.','auth/operation-not-allowed':'Ye sign-in method Firebase Authentication me enabled nahi hai.'};$('error').textContent=m[e.code]||e.message||'Authentication failed.';$('error').classList.remove('hidden')}function mode(v){signup=v;$('heading').textContent=v?'Create your account':'Welcome back';$('sub').textContent=v?'Create a free member account.':'Sign in to access your account.';$('submit').textContent=v?'Create Account →':'Sign In →';$('forgot').classList.toggle('hidden',v)}$('toggle').onclick=()=>mode(!signup);$('form').onsubmit=async e=>{e.preventDefault();$('error').classList.add('hidden');$('status').textContent='Verifying…';try{let c;if(signup){c=await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await sendEmailVerification(c.user);$('verifyBox').innerHTML='Account created. <b>Verification email sent.</b> Apne email inbox/spam me link open karke email verify karein, phir Sign In karein.';$('verifyBox').classList.remove('hidden');await signOut(auth);mode(false)}else{c=await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);if(!c.user.emailVerified){await sendEmailVerification(c.user);$('verifyBox').innerHTML='Email verified nahi hai. Verification email dobara bhej diya hai. Email verify karke phir login karein.';$('verifyBox').classList.remove('hidden');await signOut(auth);return}location.href='index.html'}}catch(x){err(x)}finally{$('status').textContent=''}};$('google').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider());location.href='index.html'}catch(e){err(e)}};$('forgot').onclick=async()=>{const e=$('email').value.trim();if(!e){$('error').textContent='Pehle email enter karo.';$('error').classList.remove('hidden');return}try{await sendPasswordResetEmail(auth,e);$('status').textContent='Password reset email bhej diya gaya.'}catch(x){err(x)}};$('phone').onclick=()=>{$('phoneBox').classList.toggle('hidden')};function setupCaptcha(){if(verifier)return;verifier=new RecaptchaVerifier(auth,'recaptcha',{size:'invisible'})}$('sendOtp').onclick=async()=>{try{setupCaptcha();const n=$('phoneNumber').value.trim();if(!/^\+[1-9]\d{7,14}$/.test(n))throw{code:'auth/invalid-phone-number'};$('status').textContent='Sending OTP…';confirmation=await signInWithPhoneNumber(auth,n,verifier);$('otpBox').classList.remove('hidden');$('status').textContent='OTP SMS par bhej diya gaya.'}catch(e){err(e);if(verifier){verifier.clear();verifier=null}}};$('verifyOtp').onclick=async()=>{try{if(!confirmation)throw{code:'auth/invalid-verification-code'};const code=$('otp').value.trim();if(!/^\d{6}$/.test(code))throw{code:'auth/invalid-verification-code'};await confirmation.confirm(code);location.href='index.html'}catch(e){err(e)}};onAuthStateChanged(auth,u=>{if(u&&!u.isAnonymous&&!location.pathname.endsWith('auth.html'))location.href='index.html'});</script></body></html>
