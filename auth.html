<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>Sign In | Jangira E Mitra</title><style>body{margin:0;min-height:100vh;color:#fff;background:radial-gradient(circle at 15% 10%,rgba(255,138,0,.17),transparent 30%),#09090b;font:14px system-ui,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(440px,100%);padding:30px;border:1px solid #ffffff1c;border-radius:28px;background:#ffffff0b;backdrop-filter:blur(28px);box-shadow:0 30px 90px #0008}.logo{width:64px;height:64px;object-fit:contain;margin-bottom:15px}.ey{color:#ffad4d;font-weight:900;letter-spacing:1.5px;font-size:11px}.card h1{font-size:34px;margin:8px 0}.muted{color:#aaa}.field{margin:14px 0}.field label{display:block;margin-bottom:6px;font-weight:800}.input{width:100%;box-sizing:border-box;padding:14px;border-radius:13px;border:1px solid #ffffff18;background:#0005;color:#fff;outline:0}.input:focus{border-color:#ff8a00;box-shadow:0 0 0 3px #ff8a0018}.btn{width:100%;padding:14px;border-radius:13px;border:1px solid #ffffff18;background:#ffffff08;color:#fff;font-weight:900;cursor:pointer;margin-top:8px}.primary{background:#ff8a00;color:#111;border-color:#ff8a00}.link{color:#ffad4d;font-weight:700;cursor:pointer}.error{margin-top:12px;padding:11px;border-radius:11px;color:#ffb0b0;background:#ff333311;border:1px solid #ff555533}.hidden{display:none!important}.row{display:flex;justify-content:space-between}</style></head><body><div class="wrap"><main class="card"><img class="logo" src="assets/logo.png" alt="Jangira E Mitra"><div class="ey">JANGIRA E MITRA • MEMBER ACCOUNT</div><h1 id="heading">Welcome back</h1><p class="muted" id="sub">Sign in to access your account.</p><form id="form"><div class="field"><label>Email</label><input class="input" id="email" type="email" autocomplete="email" required></div><div class="field"><label>Password</label><input class="input" id="password" type="password" autocomplete="current-password" minlength="6" required></div><div class="row"><span></span><span id="forgot" class="link">Forgot password?</span></div><button class="btn primary" id="submit">Sign In →</button></form><button class="btn" id="google">Continue with Google</button><button class="btn" id="phone">Continue with Phone</button><p class="muted" style="text-align:center">New here? <span id="toggle" class="link">Create account</span></p><div id="error" class="error hidden"></div><div id="status" class="muted" style="text-align:center"></div></main></div><script type="module">import{auth}from'./js/firebase-config.js';import{signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,GoogleAuthProvider,signInWithPopup,RecaptchaVerifier,signInWithPhoneNumber,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';const $=x=>document.getElementById(x);let signup=false;function err(e){$('error').textContent=({'auth/invalid-credential':'Email ya password galat hai.','auth/email-already-in-use':'Is email se account already bana hua hai.','auth/weak-password':'Password kam se kam 6 characters ka rakho.','auth/invalid-email':'Email check karo.','auth/popup-closed-by-user':'Google sign-in cancel ho gaya.','auth/popup-blocked':'Popup blocked hai.','auth/too-many-requests':'Too many attempts.','auth/network-request-failed':'Network check karo.'}[e.code]||e.message||'Authentication failed.');$('error').classList.remove('hidden')};$('toggle').onclick=()=>{signup=!signup;$('heading').textContent=signup?'Create your account':'Welcome back';$('sub').textContent=signup?'Create a free member account.':'Sign in to access your account.';$('submit').textContent=signup?'Create Account →':'Sign In →';$('forgot').classList.toggle('hidden',signup)};$('form').onsubmit=async e=>{e.preventDefault();$('error').classList.add('hidden');$('status').textContent='Verifying…';try{if(signup)await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);else await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);location.href='index.html'}catch(x){err(x)}finally{$('status').textContent=''}};$('google').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider());location.href='index.html'}catch(e){err(e)}};$('forgot').onclick=async()=>{const e=$('email').value.trim();if(!e){$('error').textContent='Pehle email enter karo.';$('error').classList.remove('hidden');return}try{await sendPasswordResetEmail(auth,e);$('status').textContent='Password reset email bhej diya gaya.'}catch(x){err(x)}};let verifier;function setupPhone(){if(verifier)return;verifier=new RecaptchaVerifier(auth,'phone',{size:'invisible'})}$('phone').onclick=async()=>{try{setupPhone();const n=prompt('Country code ke saath phone number enter karein, example +919876543210');if(!n)return;const confirmation=await signInWithPhoneNumber(auth,n,verifier);const code=prompt('SMS me aaya OTP enter karein');if(!code)return;await confirmation.confirm(code);location.href='index.html'}catch(e){err(e);if(verifier){verifier.clear();verifier=null}}};onAuthStateChanged(auth,u=>{if(u&&!u.isAnonymous)location.href='index.html'});</script></body></html>
