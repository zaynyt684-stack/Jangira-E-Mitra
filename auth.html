<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>Sign In | Jangira E Mitra</title><style>:root{--o:#ff8a00;--bg:#09090b;--line:rgba(255,255,255,.12);--muted:#a1a1aa}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;background:radial-gradient(circle at 15% 10%,rgba(255,138,0,.17),transparent 30%),radial-gradient(circle at 85% 80%,rgba(91,77,255,.14),transparent 30%),#09090b;font:14px system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden}.orb{position:fixed;border-radius:50%;filter:blur(45px);opacity:.5;pointer-events:none}.o1{width:240px;height:240px;background:#ff8a00;left:-90px;top:15%;animation:float 8s ease-in-out infinite}.o2{width:280px;height:280px;background:#5750d9;right:-120px;bottom:8%;animation:float 10s 1s ease-in-out infinite}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(470px,100%);position:relative;padding:34px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.045));backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);box-shadow:0 35px 110px rgba(0,0,0,.48);animation:enter .7s ease both}.logo{width:62px;height:62px;border-radius:20px;background:linear-gradient(145deg,#ffa83a,#ff7600);color:#111;display:grid;place-items:center;font-size:20px;font-weight:1000;box-shadow:0 15px 40px rgba(255,138,0,.22);margin-bottom:20px}.ey{font-size:11px;letter-spacing:1.8px;color:#ffb45c;font-weight:900}.card h1{font-size:38px;letter-spacing:-1.5px;margin:8px 0}.muted{color:var(--muted);line-height:1.6}.field{margin:16px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px;color:#ddd}.input{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:rgba(0,0,0,.24);color:#fff;outline:0;transition:.25s}.input:focus{border-color:rgba(255,138,0,.7);box-shadow:0 0 0 4px rgba(255,138,0,.08)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.link{color:#ffad4d;text-decoration:none;font-weight:700}.btn{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);font-weight:900;cursor:pointer;transition:.25s;background:rgba(255,255,255,.06);color:#fff}.btn:hover{transform:translateY(-2px)}.primary{background:var(--o);border-color:var(--o);color:#111}.google{margin-top:10px}.divider{display:flex;align-items:center;gap:10px;color:#71717a;margin:20px 0}.divider:before,.divider:after{content:"";height:1px;background:var(--line);flex:1}.error{margin-top:13px;padding:11px 13px;border-radius:12px;background:rgba(255,50,50,.08);border:1px solid rgba(255,80,80,.2);color:#ffadad}.status{margin-top:12px;text-align:center;color:#8ee3aa;font-size:12px}.phone{display:none}.phone.show{display:block}.hidden{display:none!important}@keyframes enter{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translate(25px,-25px) scale(1.08)}}@media(max-width:520px){.card{padding:25px;border-radius:24px}.card h1{font-size:32px}.wrap{padding:15px}}
</style></head><body><div class="orb o1"></div><div class="orb o2"></div><div class="wrap"><main class="card"><div class="logo">JE</div><div class="ey">JANGIRA E MITRA • MEMBER ACCOUNT</div><h1 id="heading">Welcome back</h1><p class="muted" id="sub">Sign in to access your Jangira E Mitra account.</p><form id="form"><div class="field"><label>Email</label><input class="input" id="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input class="input" id="password" type="password" autocomplete="current-password" required placeholder="Your password"></div><div class="row" style="margin:5px 0 16px"><span></span><a href="#" id="forgot" class="link">Forgot password?</a></div><button class="btn primary" id="submit">Sign In →</button></form><div class="divider">or</div><button class="btn google" id="google">Continue with Google</button><button class="btn google" id="phoneBtn">Continue with Phone</button><p class="muted" style="text-align:center;margin:18px 0 0">New here? <a href="#" id="toggle" class="link">Create account</a></p><div id="error" class="error hidden"></div><div id="status" class="status"></div></main></div><script type="module">import{auth}from './js/firebase-config.js';import{signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signInAnonymously}from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';const $=x=>document.getElementById(x);let signup=false;const msg=c=>({'auth/invalid-credential':'Email ya password galat hai.','auth/email-already-in-use':'Is email se account already bana hua hai.','auth/weak-password':'Password kam se kam 6 characters ka rakho.','auth/invalid-email':'Email address check karo.','auth/popup-closed-by-user':'Google sign-in cancel ho gaya.','auth/popup-blocked':'Browser ne popup block kiya.','auth/too-many-requests':'Bahut attempts ho gaye, thodi der baad try karo.','auth/network-request-failed':'Network connection check karo.'}[c]||'Authentication failed. Dobara try karo.');function error(e){$('error').textContent=msg(e.code);$('error').classList.remove('hidden')}onAuthStateChanged(auth,u=>{if(u&&!u.isAnonymous){location.href='index.html'}});$('toggle').onclick=e=>{e.preventDefault();signup=!signup;$('heading').textContent=signup?'Create your account':'Welcome back';$('sub').textContent=signup?'Create a free Jangira E Mitra member account.':'Sign in to access your Jangira E Mitra account.';$('submit').textContent=signup?'Create Account →':'Sign In →';$('forgot').classList.toggle('hidden',signup);$('toggle').textContent=signup?'Already have an account? Sign in':'Create account';$('error').classList.add('hidden')};$('form').onsubmit=async e=>{e.preventDefault();$('error').classList.add('hidden');$('status').textContent='Verifying…';$('submit').disabled=true;try{if(signup)await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);else await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value)}catch(x){error(x)}finally{$('submit').disabled=false;$('status').textContent=''}};$('google').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){error(e)}};$('forgot').onclick=async e=>{e.preventDefault();const em=$('email').value.trim();if(!em){$('error').textContent='Pehle email enter karo.';$('error').classList.remove('hidden');return}try{await sendPasswordResetEmail(auth,em);$('status').textContent='Password reset email bhej diya gaya.'}catch(x){error(x)}};$('phoneBtn').onclick=()=>{$('status').textContent='Phone sign-in ke liye Firebase reCAPTCHA + phone verification flow configure karna hoga. Is button ko next step me connect kiya ja sakta hai.'};</script></body></html>
