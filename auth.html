<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09090b">
<title>Sign In | Jangira E Mitra</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#09090b;color:#fff}body{min-height:100vh;overflow-x:hidden}.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 15%,rgba(255,138,0,.18),transparent 30%),radial-gradient(circle at 85% 80%,rgba(255,138,0,.11),transparent 30%)}.wrap{min-height:100vh;display:grid;place-items:center;padding:28px 16px;position:relative}.card{width:min(470px,100%);padding:30px;border:1px solid rgba(255,255,255,.14);border-radius:30px;background:rgba(20,20,24,.78);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 30px 100px rgba(0,0,0,.55);animation:up .45s ease both}.brand{text-align:center}.brand img{width:78px;height:78px;object-fit:contain;display:block;margin:0 auto 10px}.brand h1{margin:0;font-size:28px}.brand p{margin:8px 0 22px;color:#aaa}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1;padding:11px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(255,255,255,.04);color:#aaa;font-weight:800;cursor:pointer}.tabs button.active{color:#ffad4d;border-color:rgba(255,138,0,.45);background:rgba(255,138,0,.1)}input{width:100%;padding:14px;margin:6px 0 10px;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:rgba(0,0,0,.28);color:#fff;outline:0}input:focus{border-color:#ff8a00;box-shadow:0 0 0 3px rgba(255,138,0,.08)}button.primary{width:100%;padding:14px;border:0;border-radius:13px;background:#ff8a00;color:#111;font-weight:900;cursor:pointer}button.secondary{width:100%;padding:13px;border:1px solid rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.05);color:#fff;font-weight:800;cursor:pointer;margin-top:9px}.forgot{display:inline-block;margin:0 0 12px;color:#ffad4d;font-size:12px;font-weight:800;cursor:pointer}.msg{display:none;margin-top:12px;padding:12px;border-radius:12px;font-size:13px;line-height:1.45}.ok{display:block;color:#ffd6a8;background:rgba(255,138,0,.08);border:1px solid rgba(255,138,0,.22)}.err{display:block;color:#ffb1b1;background:rgba(255,45,45,.07);border:1px solid rgba(255,80,80,.2)}.phone{display:none;margin-top:10px;padding:13px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.025)}.otp{display:none}.back{display:block;text-align:center;margin-top:18px;color:#ffad4d;text-decoration:none;font-weight:800}.recaptcha{min-height:0}@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
</style>
</head>
<body><div class="bg"></div><main class="wrap"><section class="card"><div class="brand"><img src="assets/logo.png" alt="Jangira E Mitra"><h1 id="title">Welcome back</h1><p id="sub">Sign in, create your account, reset your password or use SMS OTP.</p></div><div class="tabs"><button id="signTab" class="active" type="button">Sign In</button><button id="createTab" type="button">Create Account</button></div><form id="form"><input id="email" type="email" placeholder="Email address" autocomplete="email" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" minlength="6" required><span id="forgot" class="forgot">Forgot password?</span><button id="submit" class="primary" type="submit">Sign In →</button></form><button id="google" class="secondary" type="button">Continue with Google</button><button id="phoneToggle" class="secondary" type="button">Continue with Phone / SMS OTP</button><div id="phoneBox" class="phone"><input id="phone" type="tel" placeholder="+919876543210" autocomplete="tel"><button id="sendOtp" class="primary" type="button">Send OTP</button><div id="otpBox" class="otp"><input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"><button id="verifyOtp" class="primary" type="button">Verify OTP</button></div></div><div id="message" class="msg"></div><div id="recaptcha" class="recaptcha"></div><a class="back" href="index.html">← Back to website</a></section></main>
<script type="module">
import {auth} from './js/firebase-config.js';
import {signInWithEmailAndPassword,createUserWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,sendPasswordResetEmail,sendEmailVerification,RecaptchaVerifier,signInWithPhoneNumber,onAuthStateChanged,signOut} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
const $=id=>document.getElementById(id);let creating=false,confirmation=null,verifier=null,cooldown=0,busy=false;
function msg(text,error=false){const e=$('message');e.textContent=text;e.className='msg '+(error?'err':'ok')}
function clear(){const e=$('message');e.textContent='';e.className='msg'}
function mode(v){creating=v;clear();$('signTab').classList.toggle('active',!v);$('createTab').classList.toggle('active',v);$('title').textContent=v?'Create your account':'Welcome back';$('sub').textContent=v?'Create a free Jangira E Mitra account.':'Sign in, create your account, reset your password or use SMS OTP.';$('submit').textContent=v?'Create Account →':'Sign In →';$('forgot').style.display=v?'none':'inline-block'}
function error(e){const m={'auth/invalid-credential':'Email ya password galat hai.','auth/email-already-in-use':'Is email se account already bana hua hai.','auth/weak-password':'Password kam se kam 6 characters ka rakho.','auth/invalid-email':'Valid email address enter karo.','auth/missing-email':'Password reset ke liye pehle email address enter karo.','auth/user-not-found':'Is email se account nahi mila.','auth/too-many-requests':'Firebase ne temporary attempts limit kar di hai. Thodi der baad OTP dobara try karo.','auth/network-request-failed':'Network check karo.','auth/operation-not-allowed':'Firebase Authentication me required provider enable nahi hai.','auth/invalid-phone-number':'Country code ke saath valid phone number enter karo.','auth/code-expired':'OTP expire ho gaya. Naya OTP bhejo.','auth/invalid-verification-code':'OTP galat hai.','auth/captcha-check-failed':'reCAPTCHA verification failed.','auth/quota-exceeded':'Firebase SMS quota/rate limit hit ho gayi hai.','auth/unauthorized-domain':'Website domain Firebase Authorized Domains me add karo.','auth/user-disabled':'Ye account disabled hai.','auth/popup-blocked':'Browser ne Google popup block kar diya.','auth/popup-closed-by-user':'Google sign-in cancel hua.'};msg(m[e.code]||e.message||'Authentication error',true)}
$('signTab').onclick=()=>mode(false);$('createTab').onclick=()=>mode(true);
$('form').onsubmit=async e=>{e.preventDefault();clear();try{const email=$('email').value.trim(),password=$('password').value;if(creating){const c=await createUserWithEmailAndPassword(auth,email,password);await sendEmailVerification(c.user);msg('Account created. Verification email isi address par bheja gaya hai. Inbox/Spam check karo.');}else{const c=await signInWithEmailAndPassword(auth,email,password);await c.user.reload();if(!c.user.emailVerified){await signOut(auth);msg('Email verify nahi hai. Verification email ke link par click karke phir login karo.',true);return}location.href='index.html'}}catch(e){error(e)}};
$('google').onclick=async()=>{clear();try{await signInWithPopup(auth,new GoogleAuthProvider());location.href='index.html'}catch(e){error(e)}};
$('forgot').onclick=async()=>{clear();const email=$('email').value.trim();if(!email){msg('Password reset ke liye pehle apna email address enter karo.',true);$('email').focus();return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msg('Valid email address enter karo.',true);return}try{await sendPasswordResetEmail(auth,email);msg('Password reset email isi entered address par request kiya gaya hai. Inbox aur Spam/Junk folder check karo.')}catch(e){error(e)}};
$('phoneToggle').onclick=()=>{$('phoneBox').style.display=$('phoneBox').style.display==='block'?'none':'block'};
function resetCaptcha(){try{verifier?.clear()}catch{}verifier=null;confirmation=null;$('recaptcha').replaceChildren()}
function captcha(){if(verifier)return verifier;verifier=new RecaptchaVerifier(auth,'recaptcha',{size:'invisible'});return verifier}
function cooldown(){cooldown=30;const b=$('sendOtp');b.disabled=true;const t=setInterval(()=>{cooldown--;b.textContent=cooldown?'Resend OTP ('+cooldown+'s)':'Send OTP';if(!cooldown){clearInterval(t);b.disabled=false}},1000)}
$('sendOtp').onclick=async()=>{if(busy||cooldown)return;busy=true;clear();$('sendOtp').disabled=true;try{const n=$('phone').value.trim();if(!/^\+[1-9]\d{7,14}$/.test(n))throw{code:'auth/invalid-phone-number'};confirmation=await signInWithPhoneNumber(auth,n,captcha());$('otpBox').style.display='block';msg('OTP SMS bhej diya gaya hai.');cooldown()}catch(e){resetCaptcha();$('sendOtp').disabled=false;error(e)}finally{busy=false}};
$('verifyOtp').onclick=async()=>{clear();try{if(!confirmation)throw{code:'auth/code-expired'};const code=$('otp').value.trim();if(!/^\d{6}$/.test(code))throw{code:'auth/invalid-verification-code'};await confirmation.confirm(code);resetCaptcha();location.href='index.html'}catch(e){error(e)}};
onAuthStateChanged(auth,u=>{if(u&&!u.isAnonymous){/* keep account page usable; sign-in remains explicit */}});
</script></body></html>
