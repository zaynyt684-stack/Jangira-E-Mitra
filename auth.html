<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09090b"><title>Sign In | Jangira E Mitra</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#09090b;color:#fff}body{min-height:100vh}.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 15%,rgba(255,138,0,.18),transparent 32%),radial-gradient(circle at 85% 80%,rgba(255,138,0,.1),transparent 32%)}main{min-height:100vh;display:grid;place-items:center;padding:32px 20px;position:relative}.card{width:min(470px,100%);padding:30px;border:1px solid rgba(255,255,255,.14);border-radius:30px;background:rgba(20,20,24,.8);backdrop-filter:blur(24px);box-shadow:0 30px 100px rgba(0,0,0,.6);animation:up .4s ease}.brand{text-align:center}.brand img{width:78px;height:78px;object-fit:contain}.brand h1{font-size:28px;margin:8px 0}.brand p{color:#aaa;margin:0 0 22px}.tabs{display:flex;gap:8px;margin-bottom:15px}.tabs button{flex:1;padding:11px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#aaa;font-weight:800;cursor:pointer}.tabs .active{color:#ffad4d;border-color:rgba(255,138,0,.45);background:rgba(255,138,0,.1)}input{width:100%;padding:14px;margin:6px 0 10px;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:rgba(0,0,0,.28);color:#fff;outline:0;font-size:15px}input:focus{border-color:#ff8a00}.primary,.secondary{width:100%;padding:14px;border-radius:13px;font-weight:900;cursor:pointer}.primary{border:0;background:#ff8a00;color:#111}.secondary{margin-top:9px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);color:#fff}.forgot{display:inline-block;margin-bottom:12px;color:#ffad4d;font-size:12px;font-weight:800;cursor:pointer}.box{display:none;margin-top:10px;padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:15px}.otp{display:none}.msg{display:none;margin-top:12px;padding:12px;border-radius:12px;font-size:13px}.ok{display:block;color:#ffd6a8;background:rgba(255,138,0,.08);border:1px solid rgba(255,138,0,.2)}.err{display:block;color:#ffb1b1;background:rgba(255,45,45,.07);border:1px solid rgba(255,80,80,.2)}.back{display:block;text-align:center;margin-top:18px;color:#ffad4d;text-decoration:none;font-weight:800}@keyframes up{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}@media(max-width:520px){main{padding:18px 12px}.card{padding:22px;border-radius:22px}.brand h1{font-size:24px}}</style></head><body><div class="bg"></div><main><section class="card"><div class="brand"><img src="./assets/logo.png?v=20260831" alt="Jangira E Mitra" onerror="this.style.display='none'"><h1 id="title">Welcome back</h1><p>Sign in, create your account, reset your password or use SMS OTP.</p></div><div class="tabs"><button id="signTab" class="active" type="button">Sign In</button><button id="createTab" type="button">Create Account</button></div><form id="form"><input id="email" type="email" placeholder="Email address" autocomplete="email"><input id="password" type="password" placeholder="Password" autocomplete="current-password" minlength="6"><span id="forgot" class="forgot">Forgot password?</span><button id="submit" class="primary" type="submit">Sign In →</button></form><button id="google" class="secondary" type="button">Continue with Google</button><button id="phoneToggle" class="secondary" type="button">Continue with Phone / SMS OTP</button><div id="phoneBox" class="box"><input id="phone" type="tel" inputmode="tel" placeholder="+919876543210" autocomplete="tel"><button id="sendOtp" class="primary" type="button">Send OTP</button><div id="otpBox" class="otp"><input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"><button id="verifyOtp" class="primary" type="button">Verify OTP</button></div></div><div id="message" class="msg"></div><div id="recaptcha"></div><a class="back" href="./index.html">← Back to website</a></section></main><script type="module">import{auth}from'./js/firebase-config.js';import{signInWithEmailAndPassword,createUserWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,sendPasswordResetEmail,sendEmailVerification,RecaptchaVerifier,signInWithPhoneNumber,signOut}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';const $=id=>document.getElementById(id);let creating=false,confirmation=null,verifier=null,sending=false,cooldown=0;const messages={'auth/invalid-credential':'Email ya password galat hai.','auth/email-already-in-use':'Is email se account already bana hua hai.','auth/weak-password':'Password kam se kam 6 characters ka rakho.','auth/invalid-email':'Valid email address enter karo.','auth/missing-email':'Password reset ke liye pehle email address enter karo.','auth/user-not-found':'Is email se account nahi mila.','auth/too-many-requests':'Firebase ne temporary attempts limit kar di hai. Thodi der baad OTP dobara try karo.','auth/network-request-failed':'Network check karo.','auth/operation-not-allowed':'Firebase Authentication me required provider enable nahi hai.','auth/invalid-phone-number':'Phone number +91XXXXXXXXXX format me enter karo.','auth/code-expired':'OTP expire ho gaya. Naya OTP bhejo.','auth/invalid-verification-code':'OTP galat hai.','auth/captcha-check-failed':'reCAPTCHA verification failed.','auth/quota-exceeded':'Firebase SMS quota/rate limit hit ho gayi hai.','auth/unauthorized-domain':'Website domain Firebase Authorized Domains me add karo.','auth/user-disabled':'Ye account disabled hai.','auth/popup-blocked':'Browser ne Google popup block kar diya.'};function show(t,e=false){const x=$('message');x.textContent=t;x.className='msg '+(e?'err':'ok')}function clear(){const x=$('message');x.textContent='';x.className='msg'}function mode(v){creating=v;clear();$('signTab').classList.toggle('active',!v);$('createTab').classList.toggle('active',v);$('title').textContent=v?'Create your account':'Welcome back';$('submit').textContent=v?'Create Account →':'Sign In →';$('forgot').style.display=v?'none':'inline-block'}function fail(e){show(messages[e?.code]||e?.message||'Authentication error',true)}$('signTab').onclick=()=>mode(false);$('createTab').onclick=()=>mode(true);$('form').onsubmit=async e=>{e.preventDefault();clear();const email=$('email').value.trim(),pass=$('password').value;if(!email){show('Email address enter karo.',true);return}if(!pass){show('Password enter karo.',true);return}try{if(creating){const c=await createUserWithEmailAndPassword(auth,email,pass);await sendEmailVerification(c.user);show('Account created. Verification email isi email par bheja gaya hai.')}else{const c=await signInWithEmailAndPassword(auth,email,pass);await c.user.reload();if(!c.user.emailVerified){await signOut(auth);show('Email verify nahi hai. Verification email verify karke phir login karo.',true);return}location.href='./index.html'}}catch(e){fail(e)}};$('google').onclick=async()=>{clear();try{await signInWithPopup(auth,new GoogleAuthProvider());location.href='./index.html'}catch(e){fail(e)}};$('forgot').onclick=async()=>{clear();const email=$('email').value.trim();if(!email){show('Password reset ke liye pehle apna email address enter karo.',true);$('email').focus();return}if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){show('Valid email address enter karo.',true);return}try{await sendPasswordResetEmail(auth,email);show('Password reset request isi entered email address ke liye submit hui hai. Inbox aur Spam/Junk check karo.')}catch(e){fail(e)}};$('phoneToggle').onclick=()=>{$('phoneBox').style.display=$('phoneBox').style.display==='block'?'none':'block'};function resetCaptcha(){try{verifier?.clear()}catch{}verifier=null;confirmation=null;$('recaptcha').replaceChildren()}function getCaptcha(){if(verifier)return verifier;verifier=new RecaptchaVerifier(auth,'recaptcha',{size:'invisible'});return verifier}function startCooldown(){cooldown=30;const b=$('sendOtp');b.disabled=true;const timer=setInterval(()=>{cooldown--;b.textContent=cooldown?'Resend OTP ('+cooldown+'s)':'Send OTP';if(!cooldown){clearInterval(timer);b.disabled=false}},1000)}$('sendOtp').onclick=async()=>{if(sending||cooldown)return;sending=true;clear();$('sendOtp').disabled=true;try{let n=$('phone').value.trim().replace(/[\s()-]/g,'');if(/^\d{10}$/.test(n))n='+91'+n;if(!/^\+[1-9]\d{7,14}$/.test(n))throw{code:'auth/invalid-phone-number'};$('phone').value=n;confirmation=await signInWithPhoneNumber(auth,n,getCaptcha());$('otpBox').style.display='block';show('OTP SMS bhej diya gaya hai.');startCooldown()}catch(e){resetCaptcha();$('sendOtp').disabled=false;fail(e)}finally{sending=false}};$('verifyOtp').onclick=async()=>{clear();try{if(!confirmation)throw{code:'auth/code-expired'};const code=$('otp').value.trim();if(!/^\d{6}$/.test(code))throw{code:'auth/invalid-verification-code'};await confirmation.confirm(code);resetCaptcha();location.href='./index.html'}catch(e){fail(e)}};</script></body></html>
