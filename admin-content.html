<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jangira E Mitra • Content CMS</title><style>:root{--o:#ff8a00;--bg:#09090b;--card:#111114;--line:#28282e;--muted:#8d8d96}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1200px;margin:auto;padding:25px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.ey{color:var(--o);font-size:11px;font-weight:900;letter-spacing:1.5px}.muted{color:var(--muted)}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,.btn{border:1px solid var(--line);background:#17171b;color:#fff;border-radius:9px;padding:10px 13px;font-weight:800;cursor:pointer}.tab.active,.orange{background:var(--o);color:#111;border-color:var(--o)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px;margin:10px 0}.field.full{grid-column:1/-1}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #333;background:#17171b;color:#fff;border-radius:9px;font:inherit}.field textarea{min-height:180px;resize:vertical}.list{display:grid;gap:9px;margin-top:18px}.item{padding:14px;border:1px solid var(--line);border-radius:12px;background:#0d0d10;display:flex;justify-content:space-between;gap:10px}.item small{display:block;color:#888;margin-top:5px}.actions{display:flex;gap:6px;flex-wrap:wrap}.danger{color:#ff8b8b}.hidden{display:none!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><header class="top"><div><div class="ey">JANGIRA E MITRA • CONTENT CMS</div><h1>Articles, Guides & Fraud Alerts</h1><p class="muted">Home aur dedicated pages ka content yahin se manage karein.</p></div><a class="btn" href="admin.html">← Dashboard</a></header><section class="panel"><div class="tabs"><button class="tab active" data-type="articles">📰 Articles</button><button class="tab" data-type="guides">📚 Guides</button><button class="tab" data-type="alerts">⚠ Fraud Alerts</button></div></section><section class="panel"><h2 id="formTitle">New Article</h2><form id="form"><div class="grid"><div class="field"><label>Title</label><input id="title" required></div><div class="field"><label>Category</label><input id="category" placeholder="Digital Safety"></div><div class="field"><label>Short Description</label><input id="excerpt" required></div><div class="field"><label>Image URL (optional)</label><input id="image"></div><div class="field full"><label>Full Content</label><textarea id="content" required placeholder="पूरा article / guide / warning यहाँ लिखें..."></textarea></div></div><div class="actions"><button class="btn orange" id="save">Publish</button><button class="btn hidden" type="button" id="cancel">Cancel Edit</button></div></form></section><section class="panel"><h2 id="listTitle">Published Articles</h2><div id="list" class="list">Loading…</div></section></div><script type="module">const ADMIN='zaynyt684@gmail.com';const C={apiKey:'AIzaSyBFkTebmxTpNnInrvYX-ffuUzQgUbRQlGw',authDomain:'jangira-e-mitra.firebaseapp.com',projectId:'jangira-e-mitra',storageBucket:'jangira-e-mitra.firebasestorage.app',messagingSenderId:'593826154587',appId:'1:593826154587:web:7e4d667e1ae19cf5cf977e'};const $=id=>document.getElementById(id);let db,auth,addDoc,updateDoc,deleteDoc,doc,collection,onSnapshot,query,orderBy;let type='articles',editing=null;const labels={articles:'Articles',guides:'Guides',alerts:'Fraud Alerts'};function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}async function init(){const a=await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js'),f=await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js'),s=await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js');const app=a.initializeApp(C);auth=f.getAuth(app);db=s.getFirestore(app);({addDoc,updateDoc,deleteDoc,doc,collection,onSnapshot,query,orderBy}=s);f.onAuthStateChanged(auth,u=>{if(!u||u.email?.toLowerCase()!==ADMIN){location.href='admin.html';return}listen()})}function listen(){const q=query(collection(db,type),orderBy('createdAt','desc'));onSnapshot(q,s=>{$('list').innerHTML=s.empty?'<p class="muted">No content yet.</p>':s.docs.map(d=>{const x=d.data();return `<div class="item"><div><b>${esc(x.title)}</b><small>${esc(x.category||labels[type])} • ${x.published===false?'Draft':'Published'}</small><small>${esc(x.excerpt||'')}</small></div><div class="actions"><button class="btn" data-edit="${d.id}">Edit</button><button class="btn danger" data-delete="${d.id}">Delete</button></div></div>`}).join('');document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete))},e=>$('list').innerHTML='<p class="danger">Unable to load content. Check Firestore rules.</p>')}async function edit(id){const snap=await import('https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js').then(s=>s.getDoc(doc(db,type,id)));const x=snap.data();editing=id;$('formTitle').textContent='Edit '+labels[type].slice(0,-1);$('title').value=x.title||'';$('category').value=x.category||'';$('excerpt').value=x.excerpt||'';$('image').value=x.image||'';$('content').value=x.content||'';$('save').textContent='Update';$('cancel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}async function remove(id){if(!confirm('Delete this content?'))return;await deleteDoc(doc(db,type,id))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');type=b.dataset.type;editing=null;$('form').reset();$('formTitle').textContent='New '+labels[type].slice(0,-1);$('save').textContent='Publish';$('cancel').classList.add('hidden');$('listTitle').textContent='Published '+labels[type];listen()});$('form').onsubmit=async e=>{e.preventDefault();const data={title:$('title').value.trim(),category:$('category').value.trim(),excerpt:$('excerpt').value.trim(),image:$('image').value.trim(),content:$('content').value.trim(),published:true,updatedAt:Date.now(),createdAt:Date.now()};if(editing){delete data.createdAt;await updateDoc(doc(db,type,editing),data)}else await addDoc(collection(db,type),data);editing=null;$('form').reset();$('formTitle').textContent='New '+labels[type].slice(0,-1);$('save').textContent='Publish';$('cancel').classList.add('hidden')};$('cancel').onclick=()=>{editing=null;$('form').reset();$('formTitle').textContent='New '+labels[type].slice(0,-1);$('save').textContent='Publish';$('cancel').classList.add('hidden')};init().catch(e=>{console.error(e);$('list').innerHTML='<p class="danger">CMS initialization failed.</p>'});</script></body></html>
