<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Online Services</title><link rel="stylesheet" href="css/admin.css"><style>body{background:#f5f5f6}.wrap{max-width:1000px;margin:30px auto;padding:16px}.panel{background:#fff;padding:24px;border-radius:20px;border:1px solid #e5e5e7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin:12px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px}.btn{padding:11px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#ff8a00}.danger{background:#fee;color:#a00}.item{padding:14px;border:1px solid #eee;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px}.spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;margin-right:7px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="panel"><a href="admin.html">← Dashboard</a><h1>🔗 Online Services</h1><div class="grid"><div><div class="field"><label>Name</label><input id="name" placeholder="Rajasthan SSO"></div><div class="field"><label>Category</label><input id="category" placeholder="Government Portal"></div><div class="field"><label>Official URL</label><input id="url" placeholder="https://..."></div><button id="save" class="btn primary">Save Link</button></div><div><h3>Saved Links</h3><div id="list"></div></div></div></div></div><script type="module">import{auth,db}from'./js/firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{collection,doc,setDoc,deleteDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';const $=x=>document.getElementById(x),slug=x=>x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||Date.now()+'';const toast=m=>{const x=document.createElement('div');x.textContent=m;x.style='position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:13px 17px;border-radius:10px';document.body.append(x);setTimeout(()=>x.remove(),2500)};onAuthStateChanged(auth,u=>{if(u?.email?.toLowerCase()!=='zaynyt684@gmail.com')location.href='admin.html';else onSnapshot(collection(db,'links'),s=>{$('list').innerHTML=s.docs.map(d=>{const x=d.data();return`<div class=item><span><b>${x.name||''}</b><br><small>${x.url||''}</small></span><span><a href="${x.url||'#'}" target="_blank">Open</a> <button class="btn danger" data-id="${d.id}">Delete</button></span></div>`}).join('')||'<p>No links.</p>'})});$('save').onclick=async()=>{const n=$('name').value.trim(),u=$('url').value.trim();if(!n||!/^https?:\/\//i.test(u))return toast('Valid name और URL डालें');const b=$('save');b.disabled=true;b.innerHTML='<span class=spinner></span>Saving...';try{await setDoc(doc(db,'links',slug(n)),{name:n,category:$('category').value.trim(),url:u,updatedAt:new Date()},{merge:true});toast('✓ Link saved')}catch(e){toast('✕ '+e.message)}finally{b.disabled=false;b.textContent='Save Link'}};document.addEventListener('click',async e=>{if(e.target.dataset.id&&confirm('Delete link?')){try{await deleteDoc(doc(db,'links',e.target.dataset.id));toast('✓ Deleted')}catch(x){toast('✕ '+x.message)}}});</script></body></html>
