<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Online Services</title><link rel="stylesheet" href="css/admin.css"><style>body{background:#f5f5f6}.wrap{max-width:1100px;margin:24px auto;padding:16px}.panel{background:#fff;padding:22px;border-radius:18px;border:1px solid #e5e5e7;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}.field{margin:10px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input,.field select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:10px}.btn{padding:10px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#ff8a00}.danger{background:#fee;color:#a00}.muted{color:#777;font-size:12px}.item{padding:14px;border:1px solid #eee;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:6px;flex-wrap:wrap}</style></head><body><div class="wrap"><div class="panel"><a href="admin.html">← Dashboard</a><h1>🔗 Online Services</h1><p class="muted">Verified links with edit, search and realtime sync.</p><div class="grid"><div><input type="hidden" id="editId"><div class="field"><label>Name</label><input id="name"></div><div class="field"><label>Category</label><input id="category"></div><div class="field"><label>Official URL</label><input id="url" placeholder="https://..."></div><div class="actions"><button id="save" class="btn primary">Save Link</button><button id="reset" class="btn">Reset</button></div><div id="status" class="muted"></div></div><div><input id="search" class="field" placeholder="Search links..."><div id="list"></div></div></div></div></div><script type="module">import{auth,db}from'./js/firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{collection,doc,setDoc,deleteDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';const ADMIN='zaynyt684@gmail.com',$=x=>document.getElementById(x);let items=[];const slug=x=>x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||Date.now()+'';const msg=x=>$('status').textContent=x;function reset(){['editId','name','category','url'].forEach(x=>$(x).value='')}function render(){const q=$('search').value.toLowerCase();$('list').innerHTML=items.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>`<div class=item><div><b>${x.name||''}</b><br><span class=muted>${x.category||'General'} · ${x.url||''}</span></div><div class=actions><a class="btn" target="_blank" href="${x.url||'#'}">Open</a><button class="btn" data-edit="${x.id}">Edit</button><button class="btn danger" data-del="${x.id}">Delete</button></div></div>`).join('')||'<p class=muted>No links.</p>'}onAuthStateChanged(auth,u=>{if(!u||u.email?.toLowerCase()!==ADMIN)return location.href='admin.html';onSnapshot(collection(db,'links'),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()})});$('search').oninput=render;$('reset').onclick=reset;$('save').onclick=async()=>{const n=$('name').value.trim(),u=$('url').value.trim();if(!n||!/^https?:\/\//i.test(u))return msg('Valid name और URL डालें');const id=$('editId').value||slug(n);try{await setDoc(doc(db,'links',id),{name:n,category:$('category').value.trim()||'General',url:u,updatedAt:serverTimestamp()},{merge:true});msg('✓ Link saved and live');reset()}catch(e){msg('✕ '+e.message)}};document.addEventListener('click',async e=>{if(e.target.dataset.edit){const x=items.find(a=>a.id===e.target.dataset.edit);$('editId').value=x.id;$('name').value=x.name||'';$('category').value=x.category||'';$('url').value=x.url||'';window.scrollTo({top:0,behavior:'smooth'})}if(e.target.dataset.del&&confirm('Delete this link?')){try{await deleteDoc(doc(db,'links',e.target.dataset.del));msg('✓ Deleted')}catch(x){msg('✕ '+x.message)}}});</script></body></html>
