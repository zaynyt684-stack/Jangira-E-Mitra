<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Gallery</title><link rel="stylesheet" href="css/admin.css"></head><body><main class="admin-wrap"><section class="panel rise"><a href="admin.html">← Dashboard</a><h1>📸 Gallery</h1><p class="muted">Website gallery images add, edit aur delete karein.</p><div class="grid"><div><div class="field"><label>Title</label><input id="title" required></div><div class="field"><label>Image URL / Asset Path</label><input id="image" placeholder="assets/photo.jpg" required></div><div class="field"><label>Description</label><textarea id="description" rows="4"></textarea></div><label><input id="active" type="checkbox" checked> Active</label><div class="admin-actions" style="margin-top:14px"><button id="save" class="btn btn-primary">Save Image</button><button id="reset" class="btn btn-light">Reset</button></div></div><div><div id="preview"></div><div id="list"></div></div></div></section></main><script type="module">import{auth,db}from'./js/firebase-config.js';import{requireAdmin,$,toast,busy}from'./admin-common.js';import{collection,doc,setDoc,deleteDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';let items=[],editId='';const slug=x=>x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||Date.now()+'';function preview(){const u=$('image').value.trim();$('preview').innerHTML=u?`<img src="${u}" alt="Preview" style="max-width:100%;max-height:230px;border-radius:14px;margin:12px 0" onerror="this.alt='Image not found'">`:''}function reset(){editId='';['title','image','description'].forEach(id=>$(id).value='');$('active').checked=true;preview()}function render(){ $('list').innerHTML=items.map(x=>`<div class="item"><div><h3>${x.title||'Untitled'}</h3><p>${x.description||''}</p><span class="status">${x.active===false?'Inactive':'Active'}</span></div><div class="admin-actions"><button class="btn btn-light" data-edit="${x.id}">Edit</button><button class="btn btn-danger" data-del="${x.id}">Delete</button></div></div>`).join('')||'<div class="empty">No gallery images yet.</div>'}requireAdmin(()=>onSnapshot(collection(db,'gallery'),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()}));$('image').oninput=preview;$('reset').onclick=reset;$('save').onclick=async()=>{if(!$('title').value.trim()||!$('image').value.trim())return toast('Title aur image path required','error');const done=busy($('save'));try{const id=editId||slug($('title').value);await setDoc(doc(db,'gallery',id),{title:$('title').value.trim(),image:$('image').value.trim(),description:$('description').value.trim(),active:$('active').checked,updatedAt:serverTimestamp()},{merge:true});toast('✓ Gallery updated');reset()}catch(e){toast('✕ '+e.message,'error')}finally{done()}};document.addEventListener('click',async e=>{const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');if(ed){const x=items.find(a=>a.id===ed.dataset.edit);editId=x.id;$('title').value=x.title||'';$('image').value=x.image||'';$('description').value=x.description||'';$('active').checked=x.active!==false;preview();scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('Delete this image?')){try{await deleteDoc(doc(db,'gallery',del.dataset.del));toast('✓ Deleted')}catch(x){toast('✕ '+x.message,'error')}}});</script></body></html>
