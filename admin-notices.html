<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Notices</title><link rel="stylesheet" href="css/admin.css"></head><body><main class="admin-wrap"><section class="panel rise"><a href="admin.html">← Dashboard</a><h1>🔔 Notices</h1><p class="muted">Important notices publish karein aur expiry control karein.</p><div class="grid"><div><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Message</label><textarea id="message" rows="6"></textarea></div><div class="field"><label>Expiry Date</label><input id="expiresAt" type="date"></div><label><input id="active" type="checkbox" checked> Active</label><div class="admin-actions" style="margin-top:14px"><button id="save" class="btn btn-primary">Publish Notice</button><button id="reset" class="btn btn-light">Reset</button></div></div><div id="list"></div></div></section></main><script type="module">import{requireAdmin,$,toast,busy}from'./admin-common.js';import{collection,doc,setDoc,deleteDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';let items=[],editId='';const slug=x=>x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||Date.now()+'';function reset(){editId='';['title','message','expiresAt'].forEach(id=>$(id).value='');$('active').checked=true}function render(){const today=new Date().toISOString().slice(0,10);$('list').innerHTML=items.map(x=>{const expired=x.expiresAt&&x.expiresAt<today;return `<div class="item"><div><h3>${x.title||'Untitled'}</h3><p>${x.message||''}</p><span class="status">${expired?'Expired':x.active===false?'Inactive':'Active'}${x.expiresAt?' · '+x.expiresAt:''}</span></div><div class="admin-actions"><button class="btn btn-light" data-edit="${x.id}">Edit</button><button class="btn btn-danger" data-del="${x.id}">Delete</button></div></div>`}).join('')||'<div class="empty">No notices yet.</div>'}requireAdmin(()=>onSnapshot(collection((await import('./js/firebase-config.js')).db,'notices'),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()}));let db;import('./js/firebase-config.js').then(x=>db=x.db);$('reset').onclick=reset;$('save').onclick=async()=>{if(!$('title').value.trim()||!$('message').value.trim())return toast('Title aur message required','error');const done=busy($('save'));try{const id=editId||slug($('title').value);await setDoc(doc(db,'notices',id),{title:$('title').value.trim(),message:$('message').value.trim(),expiresAt:$('expiresAt').value||'',active:$('active').checked,updatedAt:serverTimestamp()},{merge:true});toast('✓ Notice published');reset()}catch(e){toast('✕ '+e.message,'error')}finally{done()}};document.addEventListener('click',async e=>{const ed=e.target.closest('[data-edit]'),del=e.target.closest('[data-del]');if(ed){const x=items.find(a=>a.id===ed.dataset.edit);editId=x.id;$('title').value=x.title||'';$('message').value=x.message||'';$('expiresAt').value=x.expiresAt||'';$('active').checked=x.active!==false;scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('Delete this notice?')){await deleteDoc(doc(db,'notices',del.dataset.del));toast('✓ Deleted')}});</script></body></html>
