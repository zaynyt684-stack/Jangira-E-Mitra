<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Broadcast</title><link rel="stylesheet" href="css/admin.css"></head><body><main class="admin-wrap"><div class="panel rise"><a href="admin.html">← Dashboard</a><h1>📢 Live Broadcast</h1><p>Website पर तुरंत announcement publish करें.</p><div class="field"><label>Message</label><textarea id="message" rows="5" placeholder="नई सेवा उपलब्ध है..."></textarea></div><div class="field"><label>Button Text</label><input id="buttonText" placeholder="अधिक जानकारी"></div><div class="field"><label>Button Link</label><input id="url" placeholder="https://..."></div><div class="field"><label>Type</label><select id="type"><option value="info">Information</option><option value="important">Important</option><option value="success">Success</option></select></div><label class="switch-row"><span>Active Broadcast</span><input id="active" type="checkbox"></label><button id="save" class="btn btn-primary">Publish Broadcast</button><div id="status"></div></div></main><script type="module">import{auth,db}from './js/firebase-config.js';import{onAuthStateChanged}from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{doc,setDoc,onSnapshot,serverTimestamp}from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';import{busy,toast}from './admin-common.js';const $=id=>document.getElementById(id);onAuthStateChanged(auth,u=>{if(u?.email?.toLowerCase()!=='zaynyt684@gmail.com')location.href='admin.html';else onSnapshot(doc(db,'content','broadcast'),s=>{if(s.exists()){const x=s.data();$('message').value=x.message||'';$('buttonText').value=x.buttonText||'';$('url').value=x.url||'';$('type').value=x.type||'info';$('active').checked=!!x.active}})});$('save').onclick=async()=>{if(!$('message').value.trim())return toast('Message डालें','error');const done=busy($('save'),'Publishing...');try{await setDoc(doc(db,'content','broadcast'),{message:$('message').value.trim(),buttonText:$('buttonText').value.trim(),url:$('url').value.trim(),type:$('type').value,active:$('active').checked,updatedAt:serverTimestamp()},{merge:true});toast('✓ Broadcast published')}catch(e){toast('✕ '+e.message,'error')}finally{done()}};</script></body></html>
