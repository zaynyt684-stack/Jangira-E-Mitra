<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Services</title><link rel="stylesheet" href="css/admin.css"><style>body{background:#f5f5f6}.wrap{max-width:1100px;margin:30px auto;padding:16px}.panel{background:#fff;padding:24px;border-radius:20px;border:1px solid #e5e5e7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin:10px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:5px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:10px}.btn{padding:10px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#ff8a00}.danger{background:#fee;color:#a00}.row{display:flex;gap:6px;margin:6px 0}.row input{flex:1}.item{padding:14px;border:1px solid #eee;border-radius:12px;margin:8px 0}.spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite;margin-right:7px}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="panel"><a href="admin.html">← Dashboard</a><h1>🛠️ Services Manager</h1><div class="grid"><div><div class="field"><label>Service Name</label><input id="name"></div><div class="field"><label>English Name</label><input id="english"></div><div class="field"><label>Category</label><input id="category"></div><div class="field"><label>Description</label><textarea id="description" rows="3"></textarea></div><div class="field"><label>Keywords</label><input id="keywords" placeholder="जाति, caste, certificate"></div><div class="field"><label>Note</label><textarea id="note" rows="2"></textarea></div><label><b>Required Documents</b></label><div id="docs"></div><button id="add" class="btn">+ Document</button><button id="save" class="btn primary">Save Service</button></div><div><h3>Saved Services</h3><div id="list"></div></div></div></div></div><script type="module">import{auth,db}from'./js/firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{collection,doc,setDoc,deleteDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';const $=x=>document.getElementById(x),slug=x=>x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||Date.now()+'';const toast=m=>{const x=document.createElement('div');x.textContent=m;x.style='position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:13px 17px;border-radius:10px';document.body.append(x);setTimeout(()=>x.remove(),2500)};function add(v=''){const r=document.createElement('div');r.className='row';r.innerHTML=`<input value="${v.replace(/"/g,'&quot;')}" placeholder="Required document"><button type=button class="btn danger">×</button>`;r.querySelector('button').onclick=()=>r.remove();$('docs').append(r)}$('add').onclick=()=>add();onAuthStateChanged(auth,u=>{if(u?.email?.toLowerCase()!=='zaynyt684@gmail.com')location.href='admin.html';else onSnapshot(collection(db,'services'),s=>{$('list').innerHTML=s.docs.map(d=>{const x=d.data();return`<div class=item><b>${x.name||''}</b><br><small>${x.category||''} · ${(x.documents||[]).length} documents</small><br><button class="btn danger" data-id="${d.id}">Delete</button></div>`}).join('')||'<p>No services.</p>'})});$('save').onclick=async()=>{if(!$('name').value.trim())return toast('Service name डालें');const b=$('save');b.disabled=true;b.innerHTML='<span class=spinner></span>Saving...';try{await setDoc(doc(db,'services',slug($('name').value)),{name:$('name').value.trim(),englishName:$('english').value.trim(),category:$('category').value.trim(),description:$('description').value.trim(),keywords:$('keywords').value.split(',').map(x=>x.trim()).filter(Boolean),note:$('note').value.trim(),documents:[...document.querySelectorAll('#docs input')].map(x=>x.value.trim()).filter(Boolean),updatedAt:new Date()},{merge:true});toast('✓ Service saved')}catch(e){toast('✕ '+e.message)}finally{b.disabled=false;b.textContent='Save Service'}};document.addEventListener('click',async e=>{if(e.target.dataset.id&&confirm('Delete service?')){try{await deleteDoc(doc(db,'services',e.target.dataset.id));toast('✓ Deleted')}catch(x){toast('✕ '+x.message)}}});</script></body></html>
