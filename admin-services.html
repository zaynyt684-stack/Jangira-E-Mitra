<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Services</title><link rel="stylesheet" href="css/admin.css"><style>body{background:#f5f5f6}.wrap{max-width:1200px;margin:24px auto;padding:16px}.panel{background:#fff;padding:22px;border-radius:18px;border:1px solid #e5e5e7;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:20px}.field{margin:10px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:10px}.row{display:flex;gap:6px;margin:7px 0}.row input{flex:1}.btn{padding:10px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#ff8a00}.danger{background:#fee;color:#a00}.muted{color:#777;font-size:12px}.item{padding:14px;border:1px solid #eee;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;gap:12px;align-items:center}.actions{display:flex;gap:6px;flex-wrap:wrap}</style></head><body><div class="wrap"><div class="panel"><a href="admin.html">← Dashboard</a><h1>🛠️ Services Manager</h1><p class="muted">Add, edit, search and delete services. Changes appear through realtime Firestore sync.</p><div class="grid"><div><input type="hidden" id="editId"><div class="field"><label>Service Name</label><input id="name"></div><div class="field"><label>English Name</label><input id="english"></div><div class="field"><label>Category</label><input id="category"></div><div class="field"><label>Description</label><textarea id="description"></textarea></div><div class="field"><label>Keywords</label><input id="keywords" placeholder="जाति, caste"></div><div class="field"><label>Note</label><textarea id="note"></textarea></div><label><b>Required Documents</b></label><div id="docs"></div><button id="add" class="btn">+ Document</button><div class="actions" style="margin-top:12px"><button id="save" class="btn primary">Save Service</button><button id="reset" class="btn">Reset</button></div><div id="status" class="muted"></div></div><div><input id="search" class="field" placeholder="Search services..."><div id="list"></div></div></div></div></div><script type="module">import{auth,db}from'./js/firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{collection,doc,setDoc,deleteDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';const ADMIN='zaynyt684@gmail.com',$=x=>document.getElementById(x);let items=[];const slug=x=>x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||Date.now()+'';const msg=x=>$('status').textContent=x;function add(v=''){const r=document.createElement('div');r.className='row';r.innerHTML=`<input value="${v.replace(/"/g,'&quot;')}" placeholder="Required document"><button type=button class="btn danger">×</button>`;r.querySelector('button').onclick=()=>r.remove();$('docs').append(r)}function reset(){['editId','name','english','category','description','keywords','note'].forEach(x=>$(x).value='');$('docs').innerHTML='';}function render(){const q=$('search').value.toLowerCase();$('list').innerHTML=items.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>`<div class=item><div><b>${x.name||''}</b><br><span class=muted>${x.englishName||''} · ${x.category||'General'} · ${(x.documents||[]).length} docs</span></div><div class=actions><button class="btn" data-edit="${x.id}">Edit</button><button class="btn danger" data-del="${x.id}">Delete</button></div></div>`).join('')||'<p class=muted>No services.</p>'}onAuthStateChanged(auth,u=>{if(!u||u.email?.toLowerCase()!==ADMIN)return location.href='admin.html';onSnapshot(collection(db,'services'),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()})});$('add').onclick=()=>add();$('search').oninput=render;$('reset').onclick=reset;$('save').onclick=async()=>{const n=$('name').value.trim();if(!n)return msg('Service name डालें');const id=$('editId').value||slug(n);const data={name:n,englishName:$('english').value.trim(),category:$('category').value.trim(),description:$('description').value.trim(),keywords:$('keywords').value.split(',').map(x=>x.trim()).filter(Boolean),note:$('note').value.trim(),documents:[...document.querySelectorAll('#docs input')].map(x=>x.value.trim()).filter(Boolean),updatedAt:serverTimestamp()};try{await setDoc(doc(db,'services',id),data,{merge:true});msg('✓ Service saved and live');reset()}catch(e){msg('✕ '+e.message)}};document.addEventListener('click',async e=>{if(e.target.dataset.edit){const x=items.find(a=>a.id===e.target.dataset.edit);$('editId').value=x.id;$('name').value=x.name||'';$('english').value=x.englishName||'';$('category').value=x.category||'';$('description').value=x.description||'';$('keywords').value=(x.keywords||[]).join(', ');$('note').value=x.note||'';$('docs').innerHTML='';(x.documents||[]).forEach(add);window.scrollTo({top:0,behavior:'smooth'})}if(e.target.dataset.del&&confirm('Delete this service?')){try{await deleteDoc(doc(db,'services',e.target.dataset.del));msg('✓ Deleted')}catch(x){msg('✕ '+x.message)}}});</script></body></html>
