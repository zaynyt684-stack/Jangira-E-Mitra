name: Admin File Upload
on:
  workflow_dispatch:
    inputs:
      filename:
        description: 'Asset filename, e.g. my-form.pdf'
        required: true
        type: string
      base64:
        description: 'Base64 encoded file content'
        required: true
        type: string
      folder:
        description: 'Assets subfolder'
        required: false
        default: 'assets'
        type: string
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write uploaded asset
        env:
          FILE_NAME: ${{ inputs.filename }}
          FILE_DATA: ${{ inputs.base64 }}
          FOLDER: ${{ inputs.folder }}
        run: |
          set -e
          case "$FILE_NAME" in
            *..*|/*) echo 'Invalid filename'; exit 1;;
          esac
          mkdir -p "$FOLDER"
          printf '%s' "$FILE_DATA" | base64 -d > "$FOLDER/$FILE_NAME"
          file "$FOLDER/$FILE_NAME"
      - name: Commit asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets
          git commit -m "Upload asset from admin panel" || echo 'No changes to commit'
          git push