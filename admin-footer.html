<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Footer & Contact</title><link rel="stylesheet" href="css/admin.css"></head><body><main class="admin-wrap"><section class="panel rise"><a href="admin.html">← Dashboard</a><h1>▦ Footer & Contact</h1><p class="muted">Footer, contact information aur map/social links ek jagah manage karein.</p><div class="grid"><div><div class="field"><label>Shop Name</label><input id="shopname"></div><div class="field"><label>Location / Tagline</label><input id="location"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>WhatsApp</label><input id="whatsapp"></div></div><div><div class="field"><label>Address</label><textarea id="address" rows="4"></textarea></div><div class="field"><label>Opening Hours</label><input id="hours"></div><div class="field"><label>Google Maps URL</label><input id="mapsUrl" placeholder="https://maps.google.com/..." ></div><div class="field"><label>Copyright Text</label><input id="copyright" placeholder="© 2026 Jangira E Mitra. All rights reserved."></div></div></div><button id="save" class="btn btn-primary">Save Footer & Contact</button><div id="status" class="muted" style="margin-top:12px"></div></section></main><script type="module">import{db}from'./js/firebase-config.js';import{requireAdmin,$,toast,busy}from'./admin-common.js';import{doc,setDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';const ids=['shopname','location','phone','whatsapp','address','hours','mapsUrl','copyright'];requireAdmin(()=>onSnapshot(doc(db,'footer','site'),s=>{if(!s.exists())return;const d=s.data();ids.forEach(id=>$(id).value=d[id]||'')}));$('save').onclick=async()=>{const done=busy($('save'));try{const data=Object.fromEntries(ids.map(id=>[id,$(id).value.trim()]));data.updatedAt=serverTimestamp();await setDoc(doc(db,'footer','site'),data,{merge:true});$('status').textContent='✓ Footer settings saved';toast('✓ Footer & Contact updated')}catch(e){$('status').textContent='✕ '+e.message;toast('✕ '+e.message,'error')}finally{done()}};</script></body></html>
