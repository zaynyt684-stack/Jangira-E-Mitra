<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Banners</title><link rel="stylesheet" href="css/admin.css"><style>body{background:#f5f5f6}.wrap{max-width:1200px;margin:24px auto;padding:16px}.panel{background:#fff;padding:22px;border-radius:18px;border:1px solid #e5e5e7;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:20px}.field{margin:10px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:10px}.btn{padding:10px 14px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#ff8a00}.danger{background:#fee;color:#a00}.muted{color:#777;font-size:12px}.item{padding:14px;border:1px solid #eee;border-radius:12px;margin:8px 0;display:flex;gap:14px;align-items:center}.thumb{width:110px;height:70px;object-fit:cover;border-radius:10px;background:#eee}.actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}</style></head><body><div class="wrap"><div class="panel"><a href="admin.html">← Dashboard</a><h1>🖼️ Banners & Posters</h1><p class="muted">Create, edit, preview and publish homepage banners. Changes are realtime.</p><div class="grid"><div><input type="hidden" id="editId"><div class="field"><label>Title</label><input id="title"></div><div class="field"><label>Image URL / GitHub Asset Path</label><input id="image" placeholder="assets/poster.jpg"></div><div class="field"><label>Description</label><textarea id="description" rows="3"></textarea></div><div class="field"><label>Button Text</label><input id="buttonText"></div><div class="field"><label>Button Link</label><input id="url" placeholder="forms.html or https://..."></div><div class="field"><label>Order</label><input id="order" type="number" value="0"></div><label><input id="active" type="checkbox" checked> Active</label><div class="actions" style="margin-top:12px"><button id="save" class="btn primary">Save Poster</button><button id="reset" class="btn">Reset</button></div><div id="status" class="muted"></div></div><div><input id="search" class="field" placeholder="Search banners..."><div id="preview"></div><div id="list"></div></div></div></div></div><script type="module">import{auth,db}from'./js/firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{collection,doc,setDoc,deleteDoc,onSnapshot,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';const ADMIN='zaynyt684@gmail.com',$=x=>document.getElementById(x);let items=[];const slug=x=>x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||Date.now()+'';const msg=x=>$('status').textContent=x;function preview(){const u=$('image').value.trim();$('preview').innerHTML=u?`<img src="${u}" style="max-width:100%;max-height:220px;border-radius:12px;margin-bottom:12px" onerror="this.alt='Image not found'">`:''}function reset(){['editId','title','image','description','buttonText','url'].forEach(x=>$(x).value='');$('order').value=0;$('active').checked=true;preview()}function render(){const q=$('search').value.toLowerCase();$('list').innerHTML=items.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).sort((a,b)=>(a.order||0)-(b.order||0)).map(x=>`<div class=item><img class=thumb src="${x.image||''}" onerror="this.style.visibility='hidden'"><div><b>${x.title||''}</b><br><span class=muted>${x.active?'Active':'Inactive'} · Order ${x.order||0}</span></div><div class=actions><button class="btn" data-edit="${x.id}">Edit</button><button class="btn danger" data-del="${x.id}">Delete</button></div></div>`).join('')||'<p class=muted>No banners.</p>'}onAuthStateChanged(auth,u=>{if(!u||u.email?.toLowerCase()!==ADMIN)return location.href='admin.html';onSnapshot(collection(db,'banners'),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));render()})});$('search').oninput=render;$('image').oninput=preview;$('reset').onclick=reset;$('save').onclick=async()=>{const t=$('title').value.trim(),im=$('image').value.trim();if(!t||!im)return msg('Title और image path डालें');const id=$('editId').value||slug(t);try{await setDoc(doc(db,'banners',id),{title:t,image:im,description:$('description').value.trim(),buttonText:$('buttonText').value.trim(),url:$('url').value.trim(),order:Number($('order').value)||0,active:$('active').checked,updatedAt:serverTimestamp()},{merge:true});msg('✓ Banner saved and live');reset()}catch(e){msg('✕ '+e.message)}};document.addEventListener('click',async e=>{if(e.target.dataset.edit){const x=items.find(a=>a.id===e.target.dataset.edit);$('editId').value=x.id;$('title').value=x.title||'';$('image').value=x.image||'';$('description').value=x.description||'';$('buttonText').value=x.buttonText||'';$('url').value=x.url||'';$('order').value=x.order||0;$('active').checked=x.active!==false;preview();window.scrollTo({top:0,behavior:'smooth'})}if(e.target.dataset.del&&confirm('Delete this banner?')){try{await deleteDoc(doc(db,'banners',e.target.dataset.del));msg('✓ Deleted')}catch(x){msg('✕ '+x.message)}}});</script></body></html>
