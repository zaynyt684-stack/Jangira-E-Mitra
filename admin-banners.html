<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Banners</title><link rel="stylesheet" href="css/admin.css"><style>body{background:#f5f5f6}.wrap{max-width:1000px;margin:30px auto;padding:16px}.panel{background:#fff;padding:24px;border-radius:20px;border:1px solid #e5e5e7}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.field{margin:12px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd;border-radius:10px}.btn{padding:11px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.primary{background:#ff8a00}.list .item{padding:14px;border:1px solid #eee;border-radius:12px;margin:8px 0;display:flex;justify-content:space-between;gap:10px}.danger{background:#fee;color:#a00}.spinner{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;margin-right:7px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="panel"><a href="admin.html">← Dashboard</a><h1>🖼️ Banners & Posters</h1><p>GitHub assets में image रखें, फिर उसका path यहां डालें.</p><div class="grid"><div><div class="field"><label>Title</label><input id="title" placeholder="Jan Aadhaar Update"></div><div class="field"><label>Image Path</label><input id="image" placeholder="assets/poster.jpg"></div><div class="field"><label>Description</label><textarea id="description" rows="3"></textarea></div><div class="field"><label>Button Text</label><input id="buttonText" placeholder="View Details"></div><div class="field"><label>Button Link</label><input id="url" placeholder="forms.html"></div><label><input id="active" type="checkbox" checked> Active</label><br><br><button id="save" class="btn primary">Save Poster</button></div><div><h3>Preview</h3><div id="preview">Image preview</div><h3>Saved Posters</h3><div id="list" class="list"></div></div></div></div></div><script type="module">import{auth,db}from'./js/firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';import{collection,doc,setDoc,deleteDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';const $=x=>document.getElementById(x),slug=x=>x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||Date.now()+'';const toast=m=>{const x=document.createElement('div');x.textContent=m;x.style='position:fixed;right:20px;bottom:20px;background:#111;color:#fff;padding:13px 17px;border-radius:10px;z-index:9';document.body.append(x);setTimeout(()=>x.remove(),2500)};onAuthStateChanged(auth,u=>{if(u?.email?.toLowerCase()!=='zaynyt684@gmail.com')location.href='admin.html';else onSnapshot(collection(db,'banners'),s=>{$('list').innerHTML=s.docs.map(d=>{const x=d.data();return`<div class="item"><span><b>${x.title||''}</b><br><small>${x.image||''} · ${x.active?'Active':'Inactive'}</small></span><button class="btn danger" data-id="${d.id}">Delete</button></div>`}).join('')||'<p>No posters.</p>'})});$('image').oninput=()=>{$('preview').innerHTML=$('image').value?`<img src="${$('image').value}" style="max-width:100%;max-height:240px;border-radius:12px" onerror="this.alt='Image not found'">`:'Image preview'};$('save').onclick=async()=>{if(!$('title').value.trim()||!$('image').value.trim())return toast('Title और image path डालें');const b=$('save');b.disabled=true;b.innerHTML='<span class="spinner"></span>Saving...';try{await setDoc(doc(db,'banners',slug($('title').value)),{title:$('title').value.trim(),image:$('image').value.trim(),description:$('description').value.trim(),buttonText:$('buttonText').value.trim(),url:$('url').value.trim(),active:$('active').checked,updatedAt:new Date()},{merge:true});toast('✓ Poster saved')}catch(e){toast('✕ '+e.message)}finally{b.disabled=false;b.textContent='Save Poster'}};document.addEventListener('click',async e=>{if(e.target.dataset.id&&confirm('Delete poster?')){try{await deleteDoc(doc(db,'banners',e.target.dataset.id));toast('✓ Deleted')}catch(x){toast('✕ '+x.message)}}});</script></body></html>
