<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Manager</title><style>body{margin:0;background:#09090b;color:#fff;font:14px system-ui}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:#111114;border:1px solid #29292f;border-radius:18px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.drop{border:2px dashed #444;border-radius:16px;padding:30px;text-align:center}.btn{padding:11px 15px;border:0;border-radius:10px;font-weight:800;cursor:pointer;background:#ff8a00}.muted{color:#999}.progress{height:8px;background:#29292f;border-radius:8px;overflow:hidden;margin:14px 0}.bar{height:100%;width:0;background:#ff8a00;transition:.2s}.list{display:grid;gap:8px}.item{padding:12px;border:1px solid #29292f;border-radius:12px;display:flex;justify-content:space-between;gap:10px}.error{color:#ff7070}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><a href="admin.html" style="color:#ff8a00">← Dashboard</a><h1>📦 Asset Manager</h1><p class="muted">PDF, images और posters को सीधे Worker से publish करें.</p><section class="card"><div class="grid"><div><label>Folder<br><input id="folder" value="assets" style="width:100%;padding:12px;margin-top:6px;box-sizing:border-box"></label></div><div><label>Files<br><input id="files" type="file" multiple accept="application/pdf,image/*" style="margin-top:10px"></label></div><div><label>Public name prefix<br><input id="prefix" placeholder="optional" style="width:100%;padding:12px;margin-top:6px;box-sizing:border-box"></label></div></div><div id="selected" class="drop">Files select करें</div><button id="upload" class="btn">Upload Selected Files</button><div class="progress"><div id="bar" class="bar"></div></div><div id="status" class="muted"></div></section><section class="card"><h2>Quick modules</h2><div class="grid"><a class="btn" href="admin-forms.html">📄 Forms</a><a class="btn" href="admin-banners.html">🖼 Banners</a><a class="btn" href="admin-broadcast.html">📢 Broadcast</a></div></section></main><script type="module">import{auth}from'./js/firebase-config.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';const WORKER='https://jangira-upload.zaynyt684.workers.dev';const $=x=>document.getElementById(x);let user=null;onAuthStateChanged(auth,u=>{if(u?.email?.toLowerCase()==='zaynyt684@gmail.com')user=u;else location.href='admin.html'});$('files').onchange=()=>{$('selected').textContent=[...$('files').files].map(f=>`${f.name} (${(f.size/1024/1024).toFixed(2)} MB)`).join(' • ')||'Files select करें'};$('upload').onclick=async()=>{const files=[...$('files').files];if(!files.length)return $('status').textContent='File select करें';if(!user)return $('status').textContent='Admin login required';const b=$('upload');b.disabled=true;let done=0;try{const token=await user.getIdToken();for(const f of files){if(f.size>10*1024*1024)throw Error(`${f.name}: 10MB limit`);const bytes=new Uint8Array(await f.arrayBuffer());let bin='';for(let i=0;i<bytes.length;i+=32768)bin+=String.fromCharCode(...bytes.subarray(i,i+32768));let name=($('prefix').value.trim()?$('prefix').value.trim()+'-':'')+f.name;const r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({filename:name,content:btoa(bin),folder:$('folder').value.trim()||'assets'})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||`${f.name}: upload failed`);done++;$('bar').style.width=Math.round(done/files.length*100)+'%';$('status').textContent=`✓ ${done}/${files.length} uploaded`}}catch(e){$('status').innerHTML='<span class=error>✕ '+e.message+'</span>'}finally{b.disabled=false;b.textContent='Upload Selected Files'}};</script></body></html>
