<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guide | Jangira E Mitra</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/home-awareness.css"></head><body><main class="home-awareness"><div class="container"><article class="guide-card" style="max-width:850px;margin:auto"><span class="awareness-badge">DIGITAL GUIDE</span><h1 id="title">Guide</h1><div id="content"></div><a class="awareness-link" href="guides.html">← सभी Guides</a></article></div></main><script>const d={otp:{t:"OTP Safety Guide",p:["OTP किसी के साथ share न करें।","UPI PIN पैसे receive करने के लिए नहीं होता।","Unknown collect request या payment link को verify किए बिना approve न करें."]},documents:{t:"Document Privacy Guide",p:["Documents केवल trusted और verified service पर upload करें।","जहां संभव हो unnecessary copies share न करें।","Unknown WhatsApp numbers या suspicious websites को sensitive documents न भेजें."]},application:{t:"Online Application Guide",p:["Required documents की checklist पहले देखें।","Application में details documents के अनुसार भरें।","Submit करने से पहले preview check करें और acknowledgement/reference number सुरक्षित रखें."]}};const a=d[new URLSearchParams(location.search).get("id")]||d.application;document.getElementById("title").textContent=a.t;document.getElementById("content").innerHTML=a.p.map((x,i)=>`<div style="padding:15px;margin:10px 0;background:#fafafa;border-radius:12px;line-height:1.7"><b>${i+1}.</b> ${x}</div>`).join("");</script></body></html>
